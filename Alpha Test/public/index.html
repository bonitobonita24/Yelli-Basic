<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTERCOM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  /* Clay palette */
  --canvas:           #fffaf0;
  --surface-soft:     #faf5e8;
  --surface-card:     #f5f0e0;
  --surface-strong:   #ebe6d6;
  --hairline:         #e5e5e5;
  --hairline-soft:    #f0f0f0;

  --ink:              #0a0a0a;
  --body:             #3a3a3a;
  --muted:            #6a6a6a;
  --muted-soft:       #9a9a9a;

  --primary:          #0a0a0a;
  --on-primary:       #ffffff;

  --brand-pink:       #ff4d8b;
  --brand-teal:       #1a3a3a;
  --brand-lavender:   #b8a4ed;
  --brand-peach:      #ffb084;
  --brand-ochre:      #e8b94a;
  --brand-mint:       #a4d4c5;
  --brand-coral:      #ff6b5a;

  --success:          #22c55e;
  --warning:          #f59e0b;
  --error:            #ef4444;

  /* Type */
  --display:  'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:     'JetBrains Mono', 'SF Mono', Menlo, monospace;

  /* Radii */
  --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-pill: 9999px;

  /* Shadows — clay = soft pillowy, subtle */
  --shadow-1: 0 1px 2px rgba(10,10,10,.04), 0 2px 6px rgba(10,10,10,.04);
  --shadow-2: 0 4px 12px rgba(10,10,10,.06), 0 8px 24px rgba(10,10,10,.05);
  --shadow-3: 0 14px 36px rgba(10,10,10,.10), 0 24px 60px rgba(10,10,10,.08);
}

html,body{
  height:100%;background:var(--canvas);color:var(--ink);
  font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}

/* kill scanline + corner-bracket leftovers from prior theme */
body::after{display:none}
.cbrkt{display:none!important}

/* warm ambient background blobs */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 8% 4%, rgba(184,164,237,.22), transparent 35%),
    radial-gradient(circle at 96% 8%, rgba(255,176,132,.20), transparent 36%),
    radial-gradient(circle at 90% 100%, rgba(164,212,197,.22), transparent 40%);
}

/* ── LAYOUT ── */
#app{
  position:relative;z-index:1;
  display:grid;grid-template-rows:auto 1fr auto auto;
  height:100vh;padding:22px;gap:14px;max-width:1440px;margin:0 auto;
}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 4px 18px;border-bottom:1px solid var(--hairline);
}
.logo{
  font-family:var(--display);font-size:24px;font-weight:700;
  color:var(--ink);letter-spacing:-1px;line-height:1;
  display:flex;align-items:center;gap:12px;
}
.logo::before{
  content:'';width:36px;height:36px;border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%, #d8efe6, var(--brand-mint) 38%, var(--brand-teal) 90%);
  box-shadow:
    0 6px 14px rgba(26,58,58,.30),
    inset 0 2px 0 rgba(255,255,255,.45),
    inset 0 -3px 6px rgba(0,0,0,.18);
}
.logo em{
  font-style:normal;font-size:10px;font-weight:700;letter-spacing:1.6px;
  color:var(--ink);background:var(--brand-ochre);
  padding:4px 10px;border-radius:var(--r-pill);text-transform:uppercase;
}

.hdr-right{display:flex;align-items:center;gap:8px}
.conn-badge{
  display:flex;align-items:center;gap:9px;
  background:var(--surface-card);border-radius:var(--r-pill);
  padding:6px 14px 6px 11px;
  font-size:11px;font-weight:700;letter-spacing:1.3px;color:var(--ink);
  text-transform:uppercase;transition:background .25s ease;
}
.dot{
  width:9px;height:9px;border-radius:50%;background:var(--muted-soft);
  flex-shrink:0;transition:all .25s ease;
}
.dot.green{background:var(--success);box-shadow:0 0 0 4px rgba(34,197,94,.22)}
.dot.amber{background:var(--warning);box-shadow:0 0 0 4px rgba(245,158,11,.24);animation:pulse-soft 1.2s ease-in-out infinite}
.dot.red{background:var(--error);box-shadow:0 0 0 4px rgba(239,68,68,.22)}
@keyframes pulse-soft{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.6}}

/* ── MIDDLE SECTION ── */
.middle{display:flex;gap:14px;min-height:0}

/* ── VIDEO AREA ── */
.video-area{
  flex:1;position:relative;
  background:var(--surface-strong);
  border:1px solid var(--hairline);
  border-radius:var(--r-xl);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-1);
}
#remoteVideo{width:100%;height:100%;object-fit:cover;display:block;background:#000}

.vid-label{
  position:absolute;top:16px;left:16px;z-index:2;
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:1.6px;
  color:var(--ink);background:rgba(255,250,240,.92);
  padding:6px 12px;border-radius:var(--r-pill);text-transform:uppercase;
  backdrop-filter:blur(8px);box-shadow:var(--shadow-1);
}

/* idle overlay — claymation vibe */
.idle-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:
    radial-gradient(circle at 22% 28%, rgba(184,164,237,.32), transparent 48%),
    radial-gradient(circle at 78% 72%, rgba(255,176,132,.34), transparent 50%),
    radial-gradient(circle at 52% 100%, rgba(164,212,197,.30), transparent 55%),
    var(--surface-soft);
  transition:opacity .4s ease;
}
.idle-overlay.hidden{opacity:0;pointer-events:none}
.idle-glyph{
  font-size:84px;line-height:1;
  filter:drop-shadow(0 12px 24px rgba(10,10,10,.14));
  animation:float 4.4s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0) rotate(-3deg)}
  50%{transform:translateY(-10px) rotate(3deg)}
}
.idle-text{
  font-family:var(--display);font-size:18px;font-weight:600;
  color:var(--ink);letter-spacing:-0.3px;
}

/* PIP */
.pip{
  position:absolute;bottom:20px;right:20px;z-index:2;
  width:172px;height:128px;border-radius:var(--r-lg);
  overflow:hidden;background:#000;display:none;
  border:3px solid var(--canvas);
  box-shadow:var(--shadow-3);
}
.pip video{width:100%;height:100%;object-fit:cover}
.pip-lbl{
  position:absolute;bottom:7px;left:7px;
  font-size:9px;font-weight:700;color:var(--ink);
  background:rgba(255,250,240,.95);padding:3px 9px;
  border-radius:var(--r-pill);letter-spacing:1.2px;
}

/* ── SIDEBAR ── */
.sidebar{width:248px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}

.sbox{
  background:var(--canvas);
  border:1px solid var(--hairline);
  border-radius:var(--r-lg);
  padding:18px;
  box-shadow:var(--shadow-1);
}
.sbox-title{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:1.6px;
  color:var(--muted);text-transform:uppercase;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.sbox-title::before{
  content:'';width:8px;height:8px;border-radius:50%;
  background:var(--brand-ochre);
  box-shadow:0 0 0 3px rgba(232,185,74,.20);
}
.sbox:nth-child(1) .sbox-title::before{background:var(--brand-lavender);box-shadow:0 0 0 3px rgba(184,164,237,.20)}
.sbox:nth-child(2) .sbox-title::before{background:var(--brand-mint);box-shadow:0 0 0 3px rgba(164,212,197,.28)}

/* role pills */
.role-grid{display:flex;flex-direction:column;gap:4px}
.role-pill{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:var(--r-md);cursor:pointer;
  transition:background .18s ease,color .18s ease,transform .18s ease;
  font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.1px;
  color:var(--muted);background:transparent;
}
.role-pill:hover{background:var(--surface-card);color:var(--ink)}
.role-pill input{display:none}
.rk{
  width:16px;height:16px;border:2px solid var(--hairline);border-radius:50%;
  display:grid;place-items:center;flex-shrink:0;
  transition:border-color .18s ease,background .18s ease;
}
.rk::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--brand-teal);display:none}
.role-pill input:checked~.rk{border-color:var(--brand-teal)}
.role-pill input:checked~.rk::after{display:block}
.role-pill input:checked~span{color:var(--ink)}
.role-pill:has(input:checked){background:var(--surface-card);color:var(--ink)}

/* peer info */
.info-row{margin-bottom:14px}
.info-row:last-child{margin-bottom:0}
.info-lbl{
  font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--muted);
  margin-bottom:6px;text-transform:uppercase;
}
.info-val{
  font-family:var(--mono);font-size:14px;font-weight:600;
  color:var(--ink);background:var(--surface-card);
  padding:8px 12px;border-radius:var(--r-sm);
  display:inline-block;letter-spacing:1.2px;word-break:break-all;
}

/* peer list */
.peer-list{display:flex;flex-direction:column;gap:6px;min-height:32px}
.peer-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border:1px solid var(--hairline);
  border-radius:var(--r-md);cursor:pointer;background:var(--canvas);
  transition:all .2s cubic-bezier(.34,1.56,.64,1);
}
.peer-item:hover{
  border-color:var(--brand-teal);
  transform:translateY(-1px);
  box-shadow:var(--shadow-2);
}
.peer-item.selected{
  border-color:var(--brand-teal);background:var(--brand-teal);
}
.peer-item.selected span{color:var(--on-primary)}
.peer-item.selected small{color:var(--brand-mint)}
.peer-item span{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.6px}
.peer-item small{
  font-size:10px;font-weight:700;color:var(--success);letter-spacing:1.2px;
  display:flex;align-items:center;gap:5px;
}
.peer-item small::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.no-peers{
  font-size:12px;color:var(--muted-soft);padding:14px 4px;
  text-align:center;font-style:italic;font-weight:500;
}

/* ── BIG BUTTON ZONE ── */
.btn-zone{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:10px 0;flex-shrink:0;
}
.btn-wrap{position:relative;display:flex;align-items:center;justify-content:center}

/* pulse rings */
.ring{
  position:absolute;width:132px;height:132px;border-radius:50%;
  border:3px solid var(--brand-ochre);opacity:0;pointer-events:none;
}
.ring2{width:160px;height:160px;animation-delay:.42s!important}
@keyframes ring-out{
  0%{transform:scale(.78);opacity:.6}
  100%{transform:scale(1.28);opacity:0}
}
.ringing .ring{animation:ring-out 1.4s ease-out infinite}
.ringing .ring2{animation:ring-out 1.4s ease-out .42s infinite}

/* THE BUTTON — clay pillow */
#callBtn{
  width:120px;height:120px;border-radius:50%;
  border:none;outline:none;cursor:pointer;
  background:radial-gradient(circle at 32% 28%, #3a6a64, var(--brand-teal) 60%, #0d2424 100%);
  color:var(--on-primary);
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  box-shadow:
    0 16px 32px rgba(26,58,58,.32),
    0 4px 8px rgba(26,58,58,.22),
    inset 0 3px 0 rgba(255,255,255,.22),
    inset 0 -4px 10px rgba(0,0,0,.22);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease,background .3s ease;
}
#callBtn:hover:not(:disabled){
  transform:translateY(-3px) scale(1.04);
  box-shadow:
    0 26px 48px rgba(26,58,58,.38),
    0 8px 14px rgba(26,58,58,.24),
    inset 0 3px 0 rgba(255,255,255,.28),
    inset 0 -4px 10px rgba(0,0,0,.22);
}
#callBtn:active:not(:disabled){
  transform:translateY(2px) scale(.97);
  box-shadow:
    0 6px 14px rgba(26,58,58,.30),
    inset 0 3px 8px rgba(0,0,0,.26);
}
#callBtn:disabled{
  background:var(--surface-strong);color:var(--muted-soft);
  cursor:not-allowed;
  box-shadow:0 2px 6px rgba(10,10,10,.05),inset 0 1px 0 rgba(255,255,255,.40);
}

#callBtn.mode-end{
  background:radial-gradient(circle at 32% 28%, #ff9b8e, var(--brand-coral) 60%, #c4382a 100%);
  box-shadow:
    0 16px 32px rgba(255,107,90,.36),
    0 4px 8px rgba(255,107,90,.24),
    inset 0 3px 0 rgba(255,255,255,.34),
    inset 0 -4px 10px rgba(0,0,0,.16);
}
#callBtn.mode-end:hover:not(:disabled){
  box-shadow:
    0 26px 48px rgba(255,107,90,.42),
    0 8px 14px rgba(255,107,90,.26),
    inset 0 3px 0 rgba(255,255,255,.38),
    inset 0 -4px 10px rgba(0,0,0,.18);
}
#callBtn.mode-answer{
  background:radial-gradient(circle at 32% 28%, #ffe79c, var(--brand-ochre) 60%, #a37919 100%);
  color:var(--ink);
  animation:answer-bounce 1.05s ease-in-out infinite alternate;
}
@keyframes answer-bounce{
  from{
    transform:scale(1);
    box-shadow:
      0 16px 32px rgba(232,185,74,.34),
      inset 0 3px 0 rgba(255,255,255,.42),
      inset 0 -4px 10px rgba(0,0,0,.14);
  }
  to{
    transform:scale(1.06);
    box-shadow:
      0 28px 56px rgba(232,185,74,.50),
      inset 0 3px 0 rgba(255,255,255,.50),
      inset 0 -4px 10px rgba(0,0,0,.16);
  }
}

.btn-icon{
  font-size:36px;line-height:1;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.22));
  transition:transform .2s;
}
.btn-lbl{
  font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:2.4px;
  text-transform:uppercase;transition:color .2s;
}

/* status + timer */
.status-row{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:1.6px;
  color:var(--muted);text-transform:uppercase;text-align:center;min-height:18px;
}
.timer{
  font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:2px;
  color:var(--brand-coral);text-align:center;min-height:30px;
}

/* in-call controls — clay icon buttons */
.ctrl-row{display:flex;gap:10px;justify-content:center}
.ctrl-btn{
  width:46px;height:46px;border-radius:50%;
  border:1px solid var(--hairline);background:var(--canvas);
  color:var(--ink);cursor:pointer;font-size:19px;
  display:flex;align-items:center;justify-content:center;
  transition:all .18s cubic-bezier(.34,1.56,.64,1);outline:none;
  box-shadow:var(--shadow-1);
}
.ctrl-btn:hover{
  background:var(--surface-card);transform:translateY(-2px);
  box-shadow:var(--shadow-2);
}
.ctrl-btn:active{transform:translateY(0) scale(.96)}
.ctrl-btn.off{
  background:var(--brand-coral);color:var(--on-primary);
  border-color:transparent;
  box-shadow:0 8px 16px rgba(255,107,90,.32),inset 0 1px 0 rgba(255,255,255,.30);
}

/* ── LOG ── */
.log-strip{
  border:1px solid var(--hairline);background:var(--surface-soft);
  border-radius:var(--r-md);padding:8px 14px;
  max-height:64px;overflow-y:auto;flex-shrink:0;
}
.log-strip::-webkit-scrollbar{width:4px}
.log-strip::-webkit-scrollbar-track{background:transparent}
.log-strip::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:var(--r-pill)}
.lg{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.2px;line-height:1.7}
.lg.ok{color:var(--success)}
.lg.err{color:var(--error)}
.lg.warn{color:var(--warning)}
.lg.info{color:#7a5cd1}

/* ── INCOMING MODAL ── */
.modal-wrap{
  position:fixed;inset:0;background:rgba(10,15,12,.45);
  display:flex;align-items:center;justify-content:center;z-index:500;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.modal-wrap.show{opacity:1;pointer-events:all}
.modal{
  background:var(--canvas);border-radius:var(--r-xl);
  padding:42px 38px 36px;text-align:center;min-width:340px;
  box-shadow:var(--shadow-3);
  border:1px solid var(--hairline);
  transform:scale(.92);transition:transform .28s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
}
.modal-wrap.show .modal{transform:scale(1)}
.modal::before{
  content:'';position:absolute;top:0;left:0;right:0;height:8px;
  background:linear-gradient(90deg,var(--brand-pink),var(--brand-ochre),var(--brand-mint),var(--brand-lavender),var(--brand-peach));
}
.modal h2{
  font-family:var(--display);font-size:32px;font-weight:700;
  letter-spacing:-1px;color:var(--ink);margin-bottom:10px;line-height:1.05;
  display:inline-flex;align-items:center;gap:10px;
  animation:phone-shake 1.2s ease-in-out infinite;
  transform-origin:50% 60%;
}
@keyframes phone-shake{
  0%,100%{transform:rotate(0)}
  20%{transform:rotate(-8deg)}
  40%{transform:rotate(6deg)}
  60%{transform:rotate(-4deg)}
  80%{transform:rotate(4deg)}
}
.modal p{
  font-family:var(--sans);font-size:13px;font-weight:500;
  color:var(--muted);margin-bottom:24px;letter-spacing:.1px;
}
.modal-from{
  color:var(--ink)!important;font-size:14px!important;font-weight:600!important;
  background:var(--surface-card);padding:7px 16px;border-radius:var(--r-pill);
  display:inline-block;margin-bottom:20px!important;font-family:var(--mono);
  letter-spacing:.6px;
}
.mbtn-row{display:flex;gap:12px;justify-content:center}
.mbtn{
  font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.4px;
  border:none;padding:14px 28px;cursor:pointer;border-radius:var(--r-md);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .22s ease,background .22s ease;
  outline:none;text-transform:uppercase;
}
.mbtn.yes{
  background:var(--brand-teal);color:var(--on-primary);
  box-shadow:
    0 8px 18px rgba(26,58,58,.28),
    inset 0 1px 0 rgba(255,255,255,.20);
}
.mbtn.yes:hover{
  transform:translateY(-2px);
  box-shadow:
    0 14px 26px rgba(26,58,58,.34),
    inset 0 1px 0 rgba(255,255,255,.24);
}
.mbtn.yes:active{transform:translateY(0) scale(.97)}
.mbtn.no{
  background:var(--canvas);color:var(--ink);
  border:1px solid var(--hairline);
}
.mbtn.no:hover{background:var(--surface-card);transform:translateY(-2px);box-shadow:var(--shadow-1)}
.mbtn.no:active{transform:translateY(0) scale(.97)}

/* responsive */
@media(max-width:820px){
  #app{padding:14px;gap:10px}
  .sidebar{display:none}
  .pip{width:118px;height:88px;bottom:14px;right:14px}
  #callBtn{width:104px;height:104px}
  .btn-icon{font-size:30px}
  .ring{width:114px;height:114px}
  .ring2{width:140px;height:140px}
  .logo{font-size:20px}
  .logo::before{width:30px;height:30px}
  .idle-glyph{font-size:64px}
}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header>
    <div class="logo">INTERCOM <em>LAN</em></div>
    <div class="hdr-right">
      <div class="conn-badge"><div class="dot" id="wsDot"></div><span id="wsLbl">CONNECTING</span></div>
      <div class="conn-badge"><div class="dot" id="callDot"></div><span id="callLbl">IDLE</span></div>
    </div>
  </header>

  <!-- MIDDLE -->
  <div class="middle">

    <!-- VIDEO -->
    <div class="video-area">
      <div class="cbrkt tl"></div><div class="cbrkt tr"></div>
      <div class="cbrkt bl"></div><div class="cbrkt br"></div>
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="vid-label">REMOTE FEED</div>
      <div class="idle-overlay" id="idleOverlay">
        <div class="idle-glyph">📡</div>
        <div class="idle-text">No active call</div>
      </div>
      <div class="pip" id="pip">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="pip-lbl">YOU</div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">

      <!-- Role -->
      <div class="sbox">
        <div class="sbox-title">// Role</div>
        <div class="role-grid">
          <label class="role-pill"><input type="radio" name="role" value="both" checked><div class="rk"></div><span>Both sides</span></label>
          <label class="role-pill"><input type="radio" name="role" value="caller"><div class="rk"></div><span>Caller only</span></label>
          <label class="role-pill"><input type="radio" name="role" value="receiver"><div class="rk"></div><span>Receiver only</span></label>
        </div>
      </div>

      <!-- Your ID -->
      <div class="sbox">
        <div class="sbox-title">// Your Device</div>
        <div class="info-row">
          <div class="info-lbl">Device ID</div>
          <div class="info-val" id="myIdDisplay">—</div>
        </div>
        <div class="info-row" style="margin-bottom:0">
          <div class="info-lbl">Online peers</div>
          <div id="peerList" class="peer-list">
            <div class="no-peers">Waiting for peers…</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- CALL BUTTON ZONE -->
  <div class="btn-zone">
    <div class="btn-wrap" id="btnWrap">
      <div class="ring"></div>
      <div class="ring ring2"></div>
      <button id="callBtn" onclick="handleBtn()" disabled>
        <div class="btn-icon" id="btnIcon">📞</div>
        <div class="btn-lbl" id="btnLbl">CALL</div>
      </button>
    </div>
    <div class="status-row" id="statusRow">CONNECTING…</div>
    <div class="timer" id="timer"></div>
    <div class="ctrl-row" id="ctrlRow" style="display:none">
      <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()" title="Mute">🎤</button>
      <button class="ctrl-btn" id="camBtn"  onclick="toggleCam()"  title="Camera">📷</button>
    </div>
  </div>

  <!-- LOG -->
  <div class="log-strip" id="logStrip"></div>

</div>

<!-- INCOMING MODAL -->
<div class="modal-wrap" id="modal">
  <div class="modal">
    <div class="cbrkt tl"></div><div class="cbrkt br"></div>
    <h2>📞 INCOMING</h2>
    <p class="modal-from" id="modalFrom">from unknown</p>
    <p>Accept this call?</p>
    <div class="mbtn-row">
      <button class="mbtn yes" onclick="acceptCall()">ACCEPT</button>
      <button class="mbtn no"  onclick="rejectCall()">REJECT</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────────────────────────────────────
const S = {
  myId: null,
  peerId: null,       // currently selected peer
  peers: [],          // list of online peers
  ws: null,
  pc: null,           // RTCPeerConnection
  localStream: null,
  callState: 'idle',  // idle | outgoing | incoming | in-call
  muted: false,
  camOff: false,
  timerInt: null,
  timerStart: null,
};

// ─────────────────────────────────────────────────────────────────────────────
//  LOGGING
// ─────────────────────────────────────────────────────────────────────────────
function log(msg, t='') {
  const strip = document.getElementById('logStrip');
  const d = document.createElement('div');
  d.className = 'lg ' + t;
  const ts = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  d.textContent = `[${ts}] ${msg}`;
  strip.prepend(d);
  while(strip.children.length > 30) strip.lastChild.remove();
}

// ─────────────────────────────────────────────────────────────────────────────
//  STATUS UI
// ─────────────────────────────────────────────────────────────────────────────
function setStatus(txt, mode='idle') {
  document.getElementById('statusRow').textContent = txt;
  const dot = document.getElementById('callDot');
  const lbl = document.getElementById('callLbl');
  const modes = {
    'idle':   ['var(--muted)', 'IDLE'],
    'ready':  ['var(--green)', 'READY'],
    'calling':['var(--amber)', 'CALLING'],
    'in-call':['var(--red)',   'IN CALL'],
  };
  const [color, label] = modes[mode] || modes.idle;
  dot.style.background = color;
  dot.style.boxShadow = `0 0 8px ${color}`;
  lbl.textContent = label;
}

function setWS(connected) {
  const dot = document.getElementById('wsDot');
  const lbl = document.getElementById('wsLbl');
  if(connected) {
    dot.className = 'dot green'; lbl.textContent = 'SERVER OK';
  } else {
    dot.className = 'dot red'; lbl.textContent = 'DISCONNECTED';
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  BUTTON MODES
// ─────────────────────────────────────────────────────────────────────────────
function setBtn(mode) {
  const btn = document.getElementById('callBtn');
  const icon = document.getElementById('btnIcon');
  const lbl  = document.getElementById('btnLbl');
  const wrap = document.getElementById('btnWrap');
  const ctrl = document.getElementById('ctrlRow');
  btn.className = ''; btn.disabled = false;
  wrap.classList.remove('ringing');
  ctrl.style.display = 'none';
  if(mode==='call')   { icon.textContent='📞'; lbl.textContent='CALL'; }
  if(mode==='end')    { btn.classList.add('mode-end'); icon.textContent='📵'; lbl.textContent='END'; ctrl.style.display='flex'; }
  if(mode==='answer') { btn.classList.add('mode-answer'); wrap.classList.add('ringing'); icon.textContent='📲'; lbl.textContent='ANSWER'; }
  if(mode==='cancel') { btn.classList.add('mode-end'); icon.textContent='📵'; lbl.textContent='CANCEL'; }
  if(mode==='off')    { btn.disabled=true; icon.textContent='📞'; lbl.textContent='CALL'; }
}

// ─────────────────────────────────────────────────────────────────────────────
//  PEER LIST UI
// ─────────────────────────────────────────────────────────────────────────────
function renderPeers() {
  const box = document.getElementById('peerList');
  box.innerHTML = '';
  const others = S.peers.filter(id => id !== S.myId);
  if(!others.length) {
    box.innerHTML = '<div class="no-peers">No peers online…</div>';
    return;
  }
  others.forEach(id => {
    const el = document.createElement('div');
    el.className = 'peer-item' + (id===S.peerId ? ' selected' : '');
    el.innerHTML = `<span>${id}</span><small>● ONLINE</small>`;
    el.onclick = () => selectPeer(id);
    box.appendChild(el);
  });
}

function selectPeer(id) {
  S.peerId = id;
  renderPeers();
  log(`Selected peer: ${id}`, 'info');
  if(S.callState==='idle') updateReadyState();
}

function updateReadyState() {
  if(S.callState !== 'idle') return;
  const role = getRole();
  if(S.peerId && (role==='both'||role==='caller')) {
    setBtn('call');
    setStatus('SELECT PEER & PRESS CALL', 'ready');
  } else if(S.peerId && role==='receiver') {
    setBtn('off');
    setStatus('WAITING FOR CALL…', 'ready');
  } else {
    setBtn('off');
    setStatus('SELECT A PEER', 'idle');
  }
}

const getRole = () => document.querySelector('input[name=role]:checked').value;
const canCall = () => { const r=getRole(); return r==='both'||r==='caller'; };
const canRecv = () => { const r=getRole(); return r==='both'||r==='receiver'; };

document.querySelectorAll('input[name=role]').forEach(r => r.addEventListener('change', () => {
  log('Role: ' + getRole().toUpperCase(), 'info');
  if(S.callState==='idle') updateReadyState();
}));

// ─────────────────────────────────────────────────────────────────────────────
//  WEBSOCKET SIGNALING
// ─────────────────────────────────────────────────────────────────────────────
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}`);
  S.ws = ws;

  ws.onopen = () => {
    setWS(true);
    log('Connected to signaling server', 'ok');
    ws.send(JSON.stringify({ type: 'register', id: S.myId }));
  };

  ws.onclose = () => {
    setWS(false);
    log('Server disconnected — retrying in 3s…', 'err');
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => log('WebSocket error', 'err');

  ws.onmessage = ({ data }) => {
    let msg;
    try { msg = JSON.parse(data); } catch { return; }
    handleSignal(msg);
  };
}

function wsSend(obj) {
  if(S.ws && S.ws.readyState === WebSocket.OPEN) {
    S.ws.send(JSON.stringify(obj));
  }
}

function handleSignal(msg) {
  switch(msg.type) {
    case 'peers':
      S.peers = msg.peers;
      renderPeers();
      log(`Peers online: ${msg.peers.length}`, 'info');
      updateReadyState();
      break;

    case 'peer-joined':
      if(!S.peers.includes(msg.id)) S.peers.push(msg.id);
      renderPeers();
      log(`Peer joined: ${msg.id}`, 'ok');
      updateReadyState();
      break;

    case 'peer-left':
      S.peers = S.peers.filter(id => id !== msg.id);
      if(S.peerId === msg.id) {
        S.peerId = null;
        if(S.callState === 'in-call') onCallEnded('Peer disconnected');
      }
      renderPeers();
      log(`Peer left: ${msg.id}`, 'warn');
      updateReadyState();
      break;

    case 'call-request':
      if(!canRecv()) {
        wsSend({ type: 'call-reject', to: msg.from, reason: 'receiver-only' });
        return;
      }
      if(S.callState !== 'idle') {
        wsSend({ type: 'call-reject', to: msg.from, reason: 'busy' });
        return;
      }
      S.callState = 'incoming';
      S.peerId = msg.from;
      document.getElementById('modalFrom').textContent = `from  ${msg.from}`;
      document.getElementById('modal').classList.add('show');
      setBtn('answer');
      setStatus('INCOMING CALL', 'calling');
      log(`Incoming call from ${msg.from}`, 'warn');
      break;

    case 'call-reject':
      if(S.callState === 'outgoing') {
        cleanupCall();
        const reason = msg.reason === 'busy' ? 'BUSY' : 'DECLINED';
        setStatus(reason);
        log(`Call rejected: ${msg.reason}`, 'warn');
      }
      break;

    case 'offer':
      handleRemoteOffer(msg);
      break;

    case 'answer':
      handleRemoteAnswer(msg);
      break;

    case 'ice-candidate':
      if(S.pc) {
        S.pc.addIceCandidate(new RTCIceCandidate(msg.candidate))
          .catch(e => log('ICE err: '+e.message,'err'));
      }
      break;

    case 'call-end':
      if(S.callState === 'in-call' || S.callState === 'outgoing') {
        onCallEnded('Call ended by peer');
      }
      break;

    case 'error':
      log('Server error: ' + msg.message, 'err');
      break;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  MEDIA
// ─────────────────────────────────────────────────────────────────────────────
async function getMedia() {
  if(S.localStream) return S.localStream;
  try {
    S.localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    log('Camera + mic ready', 'ok');
  } catch {
    try {
      S.localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
      log('Mic ready (no camera)', 'warn');
    } catch(e) {
      log('Media denied: ' + e.message, 'err');
      return null;
    }
  }
  return S.localStream;
}

// ─────────────────────────────────────────────────────────────────────────────
//  WebRTC
// ─────────────────────────────────────────────────────────────────────────────
function createPC() {
  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
    ]
  });

  pc.onicecandidate = ({ candidate }) => {
    if(candidate) wsSend({ type: 'ice-candidate', to: S.peerId, candidate });
  };

  pc.oniceconnectionstatechange = () => {
    log('ICE: ' + pc.iceConnectionState);
    if(pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
      onConnected();
    } else if(['disconnected','failed','closed'].includes(pc.iceConnectionState)) {
      if(S.callState === 'in-call') onCallEnded('Connection lost');
    }
  };

  pc.ontrack = ({ track, streams }) => {
    log('Remote track received', 'ok');
    const rv = document.getElementById('remoteVideo');
    if(streams[0]) rv.srcObject = streams[0];
    document.getElementById('idleOverlay').classList.add('hidden');
  };

  return pc;
}

// ─────────────────────────────────────────────────────────────────────────────
//  CALL FLOW
// ─────────────────────────────────────────────────────────────────────────────
function handleBtn() {
  if(S.callState === 'idle')     startCall();
  else if(S.callState === 'outgoing') cancelCall();
  else if(S.callState === 'incoming') acceptCall();
  else if(S.callState === 'in-call')  hangUp();
}

async function startCall() {
  if(!S.peerId) { log('Select a peer first', 'warn'); return; }
  if(!canCall()) { log('Role is Receiver Only', 'warn'); return; }

  const stream = await getMedia();
  if(!stream) return;

  S.callState = 'outgoing';
  setBtn('cancel');
  setStatus('CALLING ' + S.peerId + '…', 'calling');

  // Tell the peer we want to call them
  wsSend({ type: 'call-request', to: S.peerId });

  // Create PC + offer
  S.pc = createPC();
  stream.getTracks().forEach(t => S.pc.addTrack(t, stream));

  // Show local PIP
  document.getElementById('localVideo').srcObject = stream;
  document.getElementById('pip').style.display = 'block';

  const offer = await S.pc.createOffer();
  await S.pc.setLocalDescription(offer);
  wsSend({ type: 'offer', to: S.peerId, sdp: S.pc.localDescription });
  log('Offer sent to ' + S.peerId, 'info');
}

function cancelCall() {
  wsSend({ type: 'call-end', to: S.peerId });
  cleanupCall();
  setStatus('CANCELLED');
  log('Call cancelled');
}

async function handleRemoteOffer(msg) {
  // Offer from remote side AFTER call-request was accepted
  if(!S.pc) {
    log('Got offer but no PC — rejecting', 'warn');
    return;
  }
  await S.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
  const answer = await S.pc.createAnswer();
  await S.pc.setLocalDescription(answer);
  wsSend({ type: 'answer', to: S.peerId, sdp: S.pc.localDescription });
  log('Answer sent to ' + S.peerId, 'info');
}

async function handleRemoteAnswer(msg) {
  if(!S.pc) return;
  await S.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
  log('Remote answer applied', 'ok');
}

async function acceptCall() {
  document.getElementById('modal').classList.remove('show');
  S.callState = 'connecting';

  const stream = await getMedia();
  if(!stream) { rejectCall(); return; }

  // Setup PC BEFORE offer arrives
  S.pc = createPC();
  stream.getTracks().forEach(t => S.pc.addTrack(t, stream));

  document.getElementById('localVideo').srcObject = stream;
  document.getElementById('pip').style.display = 'block';

  // Tell caller we accepted — they will send the offer
  wsSend({ type: 'call-reject', to: S.peerId, reason: 'accepted' }); // reuse channel as "accepted" ack
  // Actually just wait — caller already sent offer right after call-request,
  // it may arrive now or have arrived already (buffered by WS ordering)
  setBtn('end');
  setStatus('CONNECTING…', 'calling');
  log('Call accepted — connecting…', 'ok');
}

function rejectCall() {
  document.getElementById('modal').classList.remove('show');
  wsSend({ type: 'call-reject', to: S.peerId, reason: 'rejected' });
  S.callState = 'idle';
  S.peerId = null;
  setBtn('call');
  setStatus('CALL REJECTED');
  log('Incoming call rejected');
  updateReadyState();
}

function onConnected() {
  S.callState = 'in-call';
  setBtn('end');
  setStatus('IN CALL ● ' + S.peerId, 'in-call');
  S.timerStart = Date.now();
  S.timerInt = setInterval(tickTimer, 500);
  log('Call connected!', 'ok');
}

function tickTimer() {
  const s = Math.floor((Date.now()-S.timerStart)/1000);
  const m = String(Math.floor(s/60)).padStart(2,'0');
  const sec = String(s%60).padStart(2,'0');
  document.getElementById('timer').textContent = m + ':' + sec;
}

function hangUp() {
  wsSend({ type: 'call-end', to: S.peerId });
  onCallEnded('Call ended');
}

function onCallEnded(reason) {
  cleanupCall();
  setStatus(reason.toUpperCase());
  log(reason, 'warn');
  setTimeout(() => updateReadyState(), 100);
}

function cleanupCall() {
  clearInterval(S.timerInt);
  document.getElementById('timer').textContent = '';
  document.getElementById('idleOverlay').classList.remove('hidden');
  document.getElementById('pip').style.display = 'none';
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('localVideo').srcObject = null;
  if(S.pc) { S.pc.close(); S.pc = null; }
  if(S.localStream) { S.localStream.getTracks().forEach(t=>t.stop()); S.localStream=null; }
  S.callState = 'idle';
  S.muted = false; S.camOff = false;
  document.getElementById('muteBtn').textContent='🎤';
  document.getElementById('muteBtn').classList.remove('off');
  document.getElementById('camBtn').textContent='📷';
  document.getElementById('camBtn').classList.remove('off');
}

// ─────────────────────────────────────────────────────────────────────────────
//  CONTROLS
// ─────────────────────────────────────────────────────────────────────────────
function toggleMute() {
  if(!S.localStream) return;
  S.muted = !S.muted;
  S.localStream.getAudioTracks().forEach(t => t.enabled = !S.muted);
  const b = document.getElementById('muteBtn');
  b.textContent = S.muted ? '🔇' : '🎤';
  b.classList.toggle('off', S.muted);
}

function toggleCam() {
  if(!S.localStream) return;
  S.camOff = !S.camOff;
  S.localStream.getVideoTracks().forEach(t => t.enabled = !S.camOff);
  const b = document.getElementById('camBtn');
  b.textContent = S.camOff ? '🚫' : '📷';
  b.classList.toggle('off', S.camOff);
}

// ─────────────────────────────────────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────────────────────────────────────
function genId() {
  return [...crypto.getRandomValues(new Uint8Array(3))]
    .map(b => b.toString(16).padStart(2,'0')).join('').toUpperCase();
}

(function init() {
  S.myId = genId();
  document.getElementById('myIdDisplay').textContent = S.myId;
  setStatus('CONNECTING…');
  setBtn('off');
  connectWS();
  log('Intercom starting — ID: ' + S.myId, 'ok');
})();
</script>
</body>
</html>
