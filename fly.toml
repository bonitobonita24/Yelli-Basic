# Fly.io config for the intercom signaling server.
# Single instance only — the in-memory `clients` Map can't be shared across
# machines, so two peers landing on different instances would never see each
# other. Move to Redis/Postgres if you ever need to scale horizontally.

app = "yelli-intercom"
primary_region = "sin"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
