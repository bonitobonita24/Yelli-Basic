<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{APP_NAME}}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --canvas:           #fffaf0;
  --surface-soft:     #faf5e8;
  --surface-card:     #f5f0e0;
  --surface-strong:   #ebe6d6;
  --hairline:         #e5e5e5;
  --hairline-soft:    #f0f0f0;

  --ink:              #0a0a0a;
  --body:             #3a3a3a;
  --muted:            #6a6a6a;
  --muted-soft:       #9a9a9a;

  --on-primary:       #ffffff;

  --brand-pink:       #ff4d8b;
  --brand-teal:       #1a3a3a;
  --brand-lavender:   #b8a4ed;
  --brand-peach:      #ffb084;
  --brand-ochre:      #e8b94a;
  --brand-mint:       #a4d4c5;
  --brand-coral:      #ff6b5a;

  --success:          #22c55e;
  --warning:          #f59e0b;
  --error:            #ef4444;

  --display:  'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --sans:     'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:     'JetBrains Mono', 'SF Mono', Menlo, monospace;

  --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-pill: 9999px;

  --shadow-1: 0 1px 2px rgba(10,10,10,.04), 0 2px 6px rgba(10,10,10,.04);
  --shadow-2: 0 4px 12px rgba(10,10,10,.06), 0 8px 24px rgba(10,10,10,.05);
  --shadow-3: 0 14px 36px rgba(10,10,10,.10), 0 24px 60px rgba(10,10,10,.08);
}

html,body{
  height:100%;background:var(--canvas);color:var(--ink);
  font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}

body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 8% 4%, rgba(184,164,237,.22), transparent 35%),
    radial-gradient(circle at 96% 8%, rgba(255,176,132,.20), transparent 36%),
    radial-gradient(circle at 90% 100%, rgba(164,212,197,.22), transparent 40%);
}

#app{ position:relative;z-index:1;height:100vh; }

/* ── IDLE VIEW ── */
#idleView{
  display:flex;flex-direction:column;height:100%;padding:22px;
  max-width:560px;margin:0 auto;gap:18px;
}
#callView{ display:none; }
#app.in-call #idleView{ display:none; }
#app.in-call #callView{ display:block; }

header{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 4px 18px;border-bottom:1px solid var(--hairline);flex-shrink:0;
}
.logo{
  font-family:var(--display);font-size:24px;font-weight:700;
  color:var(--ink);letter-spacing:-1px;line-height:1;
  display:flex;align-items:center;gap:12px;
}
.logo::before{
  content:'';width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #d8efe6, var(--brand-mint) 38%, var(--brand-teal) 90%);
  box-shadow:
    0 6px 14px rgba(26,58,58,.30),
    inset 0 2px 0 rgba(255,255,255,.45),
    inset 0 -3px 6px rgba(0,0,0,.18);
}
.logo em{
  font-style:normal;font-size:10px;font-weight:700;letter-spacing:1.6px;
  color:var(--ink);background:var(--brand-ochre);
  padding:4px 10px;border-radius:var(--r-pill);text-transform:uppercase;
}

.hdr-right{display:flex;align-items:center;gap:8px}
.conn-badge{
  display:flex;align-items:center;gap:9px;
  background:var(--surface-card);border-radius:var(--r-pill);
  padding:6px 14px 6px 11px;
  font-size:11px;font-weight:700;letter-spacing:1.3px;color:var(--ink);
  text-transform:uppercase;transition:background .25s ease;
}
.dot{
  width:9px;height:9px;border-radius:50%;background:var(--muted-soft);
  flex-shrink:0;transition:all .25s ease;
}
.dot.green{background:var(--success);box-shadow:0 0 0 4px rgba(34,197,94,.22)}
.dot.amber{background:var(--warning);box-shadow:0 0 0 4px rgba(245,158,11,.24);animation:pulse-soft 1.2s ease-in-out infinite}
.dot.red{background:var(--error);box-shadow:0 0 0 4px rgba(239,68,68,.22)}
@keyframes pulse-soft{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.6}}

/* device info bar */
.device-bar{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--canvas);border:1px solid var(--hairline);
  border-radius:var(--r-lg);padding:14px 18px;box-shadow:var(--shadow-1);
}
.device-bar .lbl{
  font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--muted);
  text-transform:uppercase;display:block;margin-bottom:4px;
}
.device-bar .val{
  font-family:var(--mono);font-size:14px;font-weight:600;
  color:var(--ink);letter-spacing:1.2px;
}
.device-bar .peers-online{text-align:right}
.device-bar .peers-online .val{
  font-family:var(--display);font-size:22px;font-weight:800;
  color:var(--brand-teal);letter-spacing:-0.5px;
}
.device-bar .your-name{ text-align:left; }
.device-bar .your-name .val{ display:inline-flex; align-items:center; gap:.4rem; }
.edit-name-btn{
  background:none; border:1px solid transparent; border-radius:6px;
  cursor:pointer; padding:.1rem .35rem; font-size:.95rem; line-height:1;
  color:#64748b;
}
.edit-name-btn:hover{ background:#f1f5f9; color:#0f172a; }
.edit-name-btn[disabled]{ opacity:.35; cursor:not-allowed; }

/* hero zone */
.hero-zone{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:28px;
}
.hero-btn-wrap{position:relative;display:flex;align-items:center;justify-content:center}

.ring{
  position:absolute;width:240px;height:240px;border-radius:50%;
  border:3px solid var(--brand-ochre);opacity:0;pointer-events:none;
}
.ring2{width:280px;height:280px;animation-delay:.42s!important}
@keyframes ring-out{
  0%{transform:scale(.78);opacity:.6}
  100%{transform:scale(1.28);opacity:0}
}
.ringing .ring{animation:ring-out 1.4s ease-out infinite}
.ringing .ring2{animation:ring-out 1.4s ease-out .42s infinite}

/* THE BIG CALL BUTTON */
#callBtn{
  width:220px;height:220px;border-radius:50%;
  border:none;outline:none;cursor:pointer;
  background:radial-gradient(circle at 32% 28%, #3a6a64, var(--brand-teal) 60%, #0d2424 100%);
  color:var(--on-primary);
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  box-shadow:
    0 28px 60px rgba(26,58,58,.36),
    0 8px 16px rgba(26,58,58,.22),
    inset 0 5px 0 rgba(255,255,255,.22),
    inset 0 -6px 14px rgba(0,0,0,.22);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .25s ease,background .3s ease;
}
#callBtn:hover:not(:disabled){
  transform:translateY(-4px) scale(1.03);
  box-shadow:
    0 38px 72px rgba(26,58,58,.42),
    0 12px 20px rgba(26,58,58,.26),
    inset 0 5px 0 rgba(255,255,255,.28),
    inset 0 -6px 14px rgba(0,0,0,.22);
}
#callBtn:active:not(:disabled){
  transform:translateY(2px) scale(.97);
  box-shadow:
    0 8px 18px rgba(26,58,58,.32),
    inset 0 5px 12px rgba(0,0,0,.26);
}
#callBtn:disabled{
  background:var(--surface-strong);color:var(--muted-soft);cursor:not-allowed;
  box-shadow:0 2px 6px rgba(10,10,10,.05),inset 0 2px 0 rgba(255,255,255,.40);
}
#callBtn.mode-answer{
  background:radial-gradient(circle at 32% 28%, #ffe79c, var(--brand-ochre) 60%, #a37919 100%);
  color:var(--ink);
  animation:answer-bounce 1.05s ease-in-out infinite alternate;
}
@keyframes answer-bounce{
  from{transform:scale(1)}
  to{transform:scale(1.05)}
}

.btn-icon{
  font-size:72px;line-height:1;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.22));
}
.btn-lbl{
  font-family:var(--sans);font-size:14px;font-weight:800;letter-spacing:3.4px;
  text-transform:uppercase;
}

.status-row{
  font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:1.8px;
  color:var(--muted);text-transform:uppercase;text-align:center;min-height:18px;
}
.status-row.prompt{color:var(--brand-coral);animation:tap-pulse 1.6s ease-in-out infinite}
@keyframes tap-pulse{0%,100%{opacity:.7}50%{opacity:1}}

/* role chips */
.role-bar{display:flex;gap:8px;justify-content:center;flex-shrink:0;flex-wrap:wrap}
.role-chip{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--muted);
  background:var(--canvas);border:1px solid var(--hairline);
  padding:8px 14px;border-radius:var(--r-pill);cursor:pointer;
  transition:all .18s ease;user-select:none;
}
.role-chip input{display:none}
.role-chip:hover{background:var(--surface-card);color:var(--ink)}
.role-chip:has(input:checked){
  background:var(--brand-teal);color:var(--on-primary);border-color:var(--brand-teal);
  box-shadow:0 4px 10px rgba(26,58,58,.22);
}

/* log strip (idle) */
#idleView .log-strip{
  border:1px solid var(--hairline);background:var(--surface-soft);
  border-radius:var(--r-md);padding:8px 14px;
  max-height:60px;overflow-y:auto;flex-shrink:0;
}
.log-strip::-webkit-scrollbar{width:4px}
.log-strip::-webkit-scrollbar-track{background:transparent}
.log-strip::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:var(--r-pill)}
.lg{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.2px;line-height:1.7}
.lg.ok{color:var(--success)}
.lg.err{color:var(--error)}
.lg.warn{color:var(--warning)}
.lg.info{color:#7a5cd1}

/* ── CALL VIEW (fullscreen, Messenger-style) ── */
#callView{ position:fixed;inset:0;background:#000;z-index:10; }
#remoteVideo{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;background:#0a0a0a;
}

.call-overlay-top{
  position:absolute;top:0;left:0;right:0;z-index:20;
  padding:calc(env(safe-area-inset-top, 0px) + 18px) 22px 28px;
  background:linear-gradient(180deg, rgba(0,0,0,.55), transparent);
  display:flex;justify-content:space-between;align-items:flex-start;
  color:#fff;pointer-events:none;
}
.call-peer{
  font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:1.2px;
  background:rgba(0,0,0,.4);padding:8px 14px;border-radius:var(--r-pill);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:inline-block;
}
.call-status{
  font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
  margin-top:8px;opacity:.9;padding-left:6px;
}
.call-timer-top{
  font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:1.4px;
  background:rgba(0,0,0,.4);padding:8px 14px;border-radius:var(--r-pill);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}

/* PIP */
.pip{
  position:absolute;top:calc(env(safe-area-inset-top, 0px) + 96px);right:22px;z-index:25;
  width:120px;height:160px;border-radius:var(--r-lg);
  overflow:hidden;background:#000;
  border:2px solid rgba(255,255,255,.92);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  display:none;
}
#app.in-call .pip.show{display:block}
.pip video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}

/* placeholder (before remote video) */
.call-placeholder{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;color:#fff;
  background:
    radial-gradient(circle at 30% 35%, rgba(184,164,237,.30), transparent 50%),
    radial-gradient(circle at 70% 65%, rgba(255,176,132,.28), transparent 55%),
    #0a0a0a;
  z-index:5;
}
.call-placeholder.hidden{display:none}
.call-placeholder .glyph{
  font-size:84px;animation:phone-shake 1.2s ease-in-out infinite;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.4));
}
@keyframes phone-shake{
  0%,100%{transform:rotate(0)}
  20%{transform:rotate(-8deg)}
  40%{transform:rotate(6deg)}
  60%{transform:rotate(-4deg)}
  80%{transform:rotate(4deg)}
}
.call-placeholder .who{
  font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:1.2px;
}
.call-placeholder .what{
  font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.7;
}

/* call controls */
.call-controls{
  position:absolute;bottom:0;left:0;right:0;z-index:30;
  padding:24px 22px calc(24px + env(safe-area-inset-bottom, 0px));
  display:flex;gap:14px;justify-content:center;align-items:center;
  background:linear-gradient(0deg, rgba(0,0,0,.55), transparent);
}
.cc-btn{
  width:60px;height:60px;border-radius:50%;
  border:none;cursor:pointer;font-size:24px;color:#fff;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  transition:all .18s cubic-bezier(.34,1.56,.64,1);outline:none;
  box-shadow:0 6px 14px rgba(0,0,0,.4);
}
.cc-btn:hover{background:rgba(255,255,255,.28);transform:translateY(-2px)}
.cc-btn:active{transform:scale(.94)}
.cc-btn.off{background:rgba(255,255,255,.92);color:#0a0a0a}
.cc-btn.end{
  width:72px;height:72px;font-size:28px;
  background:var(--brand-coral);
  box-shadow:0 12px 26px rgba(255,107,90,.5);
}
.cc-btn.end:hover{background:#ff5847;transform:translateY(-2px) scale(1.03)}

/* ── MODALS ── */
.modal-wrap{
  position:fixed;inset:0;background:rgba(10,15,12,.45);
  display:flex;align-items:center;justify-content:center;z-index:500;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .22s ease;padding:22px;
}
.modal-wrap.show{opacity:1;pointer-events:all}
.modal{
  background:var(--canvas);border-radius:var(--r-xl);
  padding:36px 32px 28px;text-align:center;
  min-width:300px;max-width:420px;width:100%;
  box-shadow:var(--shadow-3);border:1px solid var(--hairline);
  transform:scale(.92);transition:transform .28s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
}
.modal-wrap.show .modal{transform:scale(1)}
.modal::before{
  content:'';position:absolute;top:0;left:0;right:0;height:8px;
  background:linear-gradient(90deg,var(--brand-pink),var(--brand-ochre),var(--brand-mint),var(--brand-lavender),var(--brand-peach));
}
.modal h2{
  font-family:var(--display);font-size:26px;font-weight:700;
  letter-spacing:-0.6px;color:var(--ink);margin-bottom:8px;line-height:1.1;
  display:inline-flex;align-items:center;gap:10px;
}
.modal h2.ringing-h2{
  animation:phone-shake 1.2s ease-in-out infinite;transform-origin:50% 60%;
}
.modal p{
  font-family:var(--sans);font-size:13px;font-weight:500;
  color:var(--muted);margin-bottom:22px;letter-spacing:.1px;
}
.modal-from{
  color:var(--ink)!important;font-size:14px!important;font-weight:600!important;
  background:var(--surface-card);padding:7px 16px;border-radius:var(--r-pill);
  display:inline-block;margin-bottom:18px!important;font-family:var(--mono);
  letter-spacing:.6px;
}
.mbtn-row{display:flex;gap:12px;justify-content:center}
.mbtn{
  font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.4px;
  border:none;padding:14px 28px;cursor:pointer;border-radius:var(--r-md);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .22s ease,background .22s ease;
  outline:none;text-transform:uppercase;
}
.mbtn.yes{
  background:var(--brand-teal);color:var(--on-primary);
  box-shadow:0 8px 18px rgba(26,58,58,.28),inset 0 1px 0 rgba(255,255,255,.20);
}
.mbtn.yes:hover{transform:translateY(-2px);box-shadow:0 14px 26px rgba(26,58,58,.34),inset 0 1px 0 rgba(255,255,255,.24)}
.mbtn.yes:active{transform:translateY(0) scale(.97)}
.mbtn.no{background:var(--canvas);color:var(--ink);border:1px solid var(--hairline)}
.mbtn.no:hover{background:var(--surface-card);transform:translateY(-2px);box-shadow:var(--shadow-1)}
.mbtn.no:active{transform:translateY(0) scale(.97)}

/* picker list */
.picker-list{
  display:flex;flex-direction:column;gap:8px;margin-bottom:22px;
  max-height:300px;overflow-y:auto;text-align:left;
}
.picker-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border:1px solid var(--hairline);
  border-radius:var(--r-md);cursor:pointer;background:var(--canvas);
  transition:all .2s cubic-bezier(.34,1.56,.64,1);
}
.picker-item:hover{
  border-color:var(--brand-teal);background:var(--surface-card);
  transform:translateX(2px);box-shadow:var(--shadow-1);
}
.picker-item .pid{
  font-family:var(--mono);font-size:15px;font-weight:600;
  color:var(--ink);letter-spacing:1px;
}
.picker-item .pid::before{
  content:'';display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--success);margin-right:10px;
  box-shadow:0 0 0 3px rgba(34,197,94,.22);vertical-align:middle;
}
.picker-item .pcall{
  font-family:var(--sans);font-size:10px;font-weight:800;letter-spacing:1.4px;
  padding:6px 12px;border-radius:var(--r-pill);
  background:var(--brand-mint);color:var(--brand-teal);
}
.picker-empty{
  font-size:13px;color:var(--muted);padding:28px 8px;
  text-align:center;font-style:italic;
}

/* responsive */
@media(max-width:480px){
  #idleView{padding:14px;gap:14px}
  #callBtn{width:180px;height:180px}
  .ring{width:200px;height:200px}
  .ring2{width:230px;height:230px}
  .btn-icon{font-size:56px}
  .btn-lbl{font-size:12px}
  .logo{font-size:20px}
  .logo::before{width:30px;height:30px}
  .pip{width:104px;height:140px;right:14px;top:calc(env(safe-area-inset-top, 0px) + 84px)}
  .cc-btn{width:54px;height:54px;font-size:21px}
  .cc-btn.end{width:64px;height:64px;font-size:25px}
}
.modal-backdrop{
  position:fixed; inset:0; background:rgba(15,23,42,0.78);
  display:flex; align-items:center; justify-content:center;
  z-index:9999; padding:1rem;
}
.modal-backdrop[hidden]{ display:none; }
.modal-card{
  background:#fff; border-radius:14px; padding:1.5rem 1.5rem 1.25rem;
  max-width:380px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.modal-card h2{ margin:0 0 .5rem; font-size:1.25rem; color:#0f172a; }
.modal-card .modal-hint{ margin:0 0 1rem; color:#64748b; font-size:.875rem; }
.modal-card input{
  width:100%; box-sizing:border-box; padding:.65rem .8rem;
  font-size:1rem; border:1px solid #cbd5e1; border-radius:8px;
  outline:none;
}
.modal-card input:focus{ border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.15); }
.modal-actions{
  margin-top:1rem; display:flex; gap:.5rem; justify-content:flex-end;
}
.modal-actions button{
  padding:.55rem 1.1rem; font-size:.95rem; border-radius:8px; cursor:pointer;
  border:1px solid #cbd5e1; background:#fff; color:#0f172a;
}
.modal-actions button#name-modal-save{
  background:#2563eb; border-color:#2563eb; color:#fff;
}
.modal-actions button:disabled{ opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<div id="app">

  <!-- ─── IDLE VIEW ─── -->
  <div id="idleView">

    <header>
      <div class="logo">{{APP_NAME}}</div>
      <div class="hdr-right">
        <div class="conn-badge"><div class="dot" id="wsDot"></div><span id="wsLbl">CONNECTING</span></div>
        <div class="conn-badge"><div class="dot" id="callDot"></div><span id="callLbl">IDLE</span></div>
      </div>
    </header>

    <div class="device-bar">
      <div>
        <div class="lbl">Device ID</div>
        <div class="val" id="myIdDisplay">—</div>
      </div>
      <div class="your-name">
        <div class="lbl">You</div>
        <div class="val">
          <span id="yourNameLabel">—</span>
          <button id="editNameBtn" type="button" class="edit-name-btn" title="Edit name">✎</button>
        </div>
      </div>
      <div class="peers-online">
        <div class="lbl">Online</div>
        <div class="val" id="peersOnlineCount">0</div>
      </div>
    </div>

    <div class="hero-zone">
      <div class="hero-btn-wrap" id="btnWrap">
        <div class="ring"></div>
        <div class="ring ring2"></div>
        <button id="callBtn" onclick="handleBtn()" disabled>
          <div class="btn-icon" id="btnIcon">📞</div>
          <div class="btn-lbl" id="btnLbl">CALL</div>
        </button>
      </div>
      <div class="status-row" id="statusRow">CONNECTING…</div>
    </div>

    <div class="role-bar">
      <label class="role-chip"><input type="radio" name="role" value="both" checked>Both sides</label>
      <label class="role-chip"><input type="radio" name="role" value="caller">Caller only</label>
      <label class="role-chip"><input type="radio" name="role" value="receiver">Receiver only</label>
    </div>

    <div class="log-strip" id="logStrip"></div>
  </div>

  <!-- ─── CALL VIEW (fullscreen, Messenger-style) ─── -->
  <div id="callView">
    <video id="remoteVideo" autoplay playsinline></video>

    <div class="call-placeholder" id="callPlaceholder">
      <div class="glyph">📞</div>
      <div class="who" id="callPeerWho">—</div>
      <div class="what" id="callPeerWhat">CONNECTING…</div>
    </div>

    <div class="call-overlay-top">
      <div>
        <div class="call-peer" id="callOverlayPeer">PEER</div>
        <div class="call-status" id="callOverlayStatus">CONNECTING…</div>
      </div>
      <div class="call-timer-top" id="timer">00:00</div>
    </div>

    <div class="pip" id="pip">
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div class="call-controls">
      <button class="cc-btn" id="muteBtn" onclick="toggleMute()" title="Mute">🎤</button>
      <button class="cc-btn end" onclick="handleBtn()" title="End">📵</button>
      <button class="cc-btn" id="camBtn" onclick="toggleCam()" title="Camera">📷</button>
    </div>
  </div>

</div>

<!-- ─── INCOMING MODAL ─── -->
<div class="modal-wrap" id="modal">
  <div class="modal">
    <h2 class="ringing-h2">📞 INCOMING</h2>
    <p class="modal-from" id="modalFrom">from unknown</p>
    <p>Accept this call?</p>
    <div class="mbtn-row">
      <button class="mbtn yes" onclick="acceptCall()">ACCEPT</button>
      <button class="mbtn no"  onclick="rejectCall()">REJECT</button>
    </div>
  </div>
</div>

<!-- ─── PEER PICKER MODAL ─── -->
<div class="modal-wrap" id="pickerModal">
  <div class="modal">
    <h2>📞 Call who?</h2>
    <p>Choose a peer to call</p>
    <div class="picker-list" id="pickerList"></div>
    <button class="mbtn no" onclick="closePicker()">CANCEL</button>
  </div>
</div>

<!-- Name modal (first-load + edit) -->
<div id="name-modal" class="modal-backdrop" hidden>
  <div class="modal-card">
    <h2 id="name-modal-title">What should we call you?</h2>
    <p class="modal-hint">Other people on the network will see this name when you call them.</p>
    <input id="name-modal-input" type="text" maxlength="30" placeholder="e.g. Alice" autocomplete="off" />
    <div class="modal-actions">
      <button id="name-modal-cancel" type="button" hidden>Cancel</button>
      <button id="name-modal-save" type="button">Save</button>
    </div>
  </div>
</div>

<script>
const S = {
  myId: null, peerId: null, peers: [], ws: null, pc: null,
  displayName: null,
  names: {},  // peerId → displayName
  localStream: null, callState: 'idle',
  muted: false, camOff: false, timerInt: null, timerStart: null,
};

// ── Display-name modal ─────────────────────────────────────────────
const NAME_KEY = 'yelli.displayName';

function loadStoredName() {
  try { return (localStorage.getItem(NAME_KEY) || '').trim() || null; }
  catch { return null; }
}
function storeName(name) {
  if (!name) return;
  try { localStorage.setItem(NAME_KEY, name); } catch {}
}

function openNameModal({ mode }) {
  const modal  = document.getElementById('name-modal');
  const title  = document.getElementById('name-modal-title');
  const input  = document.getElementById('name-modal-input');
  const save   = document.getElementById('name-modal-save');
  const cancel = document.getElementById('name-modal-cancel');

  title.textContent = mode === 'edit' ? 'Edit your name' : 'What should we call you?';
  cancel.hidden     = mode !== 'edit';
  input.value       = mode === 'edit' ? (S.displayName || '') : '';
  modal.hidden      = false;
  setTimeout(() => input.focus(), 0);

  return new Promise((resolve) => {
    function cleanup(result) {
      save.onclick    = null;
      cancel.onclick  = null;
      input.onkeydown = null;
      modal.hidden    = true;
      resolve(result);
    }
    function commit() {
      const v = input.value.trim().slice(0, 30);
      if (!v) { input.focus(); return; }
      Ringer.unlock();
      cleanup(v);
    }
    save.onclick    = commit;
    cancel.onclick  = () => cleanup(null);
    input.onkeydown = (e) => {
      if (e.key === 'Enter') commit();
      else if (e.key === 'Escape' && mode === 'edit') cleanup(null);
    };
  });
}

function setEditNameEnabled(enabled) {
  const btn = document.getElementById('editNameBtn');
  if (btn) btn.disabled = !enabled;
}

// ── Ringback tone (mp3 if present at /sounds/ringback.mp3, synth fallback) ──
const Ringer = (() => {
  const MP3_PATH = '/sounds/ringtone.mp3';
  let audio = null, mp3Ok = false;
  let ctx = null, gain = null, osc1 = null, osc2 = null, interval = null, on = false;

  // Probe once; falls back silently to synth if missing or unplayable
  (function probe() {
    audio = new Audio(MP3_PATH);
    audio.volume = 0.5;
    audio.addEventListener('canplaythrough', () => { mp3Ok = true; }, { once: true });
    audio.addEventListener('error', () => { mp3Ok = false; audio = null; }, { once: true });
  })();

  let pauseTimer = null;
  function scheduleNextRing() {
    pauseTimer = setTimeout(() => {
      pauseTimer = null;
      if (!on || !audio) return;
      try { audio.currentTime = 0; audio.play().catch(() => {}); } catch {}
    }, 4000);
  }

  function unlock() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch {}
  }

  function startMp3() {
    on = true;
    audio.onended = scheduleNextRing;
    try { audio.currentTime = 0; audio.play().catch(() => {}); } catch {}
  }

  function startSynth() {
    unlock();
    if (!ctx) return;
    on = true;
    gain = ctx.createGain();
    gain.gain.value = 0;
    gain.connect(ctx.destination);
    osc1 = ctx.createOscillator(); osc1.frequency.value = 440; osc1.connect(gain); osc1.start();
    osc2 = ctx.createOscillator(); osc2.frequency.value = 480; osc2.connect(gain); osc2.start();
    function ring() {
      const t = ctx.currentTime;
      gain.gain.setValueAtTime(0.05, t);
      gain.gain.setValueAtTime(0, t + 2);
    }
    ring();
    interval = setInterval(ring, 6000);
  }

  function start() {
    if (on) return;
    if (mp3Ok && audio) startMp3();
    else startSynth();
  }

  function stop() {
    if (!on) return;
    on = false;
    if (interval) { clearInterval(interval); interval = null; }
    if (pauseTimer) { clearTimeout(pauseTimer); pauseTimer = null; }
    if (audio) { try { audio.onended = null; audio.pause(); audio.currentTime = 0; } catch {} }
    if (gain) { try { gain.gain.cancelScheduledValues(0); gain.gain.value = 0; } catch {} }
    if (osc1) { try { osc1.stop(); osc1.disconnect(); } catch {} osc1 = null; }
    if (osc2) { try { osc2.stop(); osc2.disconnect(); } catch {} osc2 = null; }
    if (gain) { try { gain.disconnect(); } catch {} gain = null; }
  }

  return { unlock, start, stop };
})();

function setCallState(s) {
  S.callState = s;
  setEditNameEnabled(s === 'idle');
  if (s === 'outgoing' || s === 'incoming') Ringer.start();
  else Ringer.stop();
}

function refreshOwnNameLabel() {
  const lbl = document.getElementById('yourNameLabel');
  if (lbl) lbl.textContent = S.displayName || '—';
}

async function ensureDisplayName() {
  const stored = loadStoredName();
  if (stored) { S.displayName = stored; refreshOwnNameLabel(); }
  else {
    const chosen = await openNameModal({ mode: 'first' });
    if (!chosen) return null;
    S.displayName = chosen;
    storeName(chosen);
    refreshOwnNameLabel();
  }
  // Pre-warm camera/mic in receiver mode so auto-answer doesn't trigger prompts mid-call
  if (getRole() === 'receiver') {
    getMedia().catch(() => {});
  }
  return S.displayName;
}

function log(msg, t='') {
  const strip = document.getElementById('logStrip');
  const d = document.createElement('div');
  d.className = 'lg ' + t;
  const ts = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  d.textContent = `[${ts}] ${msg}`;
  strip.prepend(d);
  while(strip.children.length > 30) strip.lastChild.remove();
}

function setView(view) {
  document.getElementById('app').classList.toggle('in-call', view === 'call');
}

function setStatus(txt, mode='idle') {
  const row = document.getElementById('statusRow');
  row.textContent = txt;
  row.classList.toggle('prompt', mode === 'prompt');
  const dot = document.getElementById('callDot');
  const lbl = document.getElementById('callLbl');
  const modes = {
    'idle':   ['',      'IDLE'],
    'ready':  ['green', 'READY'],
    'calling':['amber', 'CALLING'],
    'in-call':['red',   'IN CALL'],
  };
  const [cls, label] = modes[mode] || modes.idle;
  dot.className = 'dot ' + cls;
  lbl.textContent = label;
}

function setWS(connected) {
  const dot = document.getElementById('wsDot');
  const lbl = document.getElementById('wsLbl');
  if(connected) { dot.className = 'dot green'; lbl.textContent = 'SERVER OK'; }
  else { dot.className = 'dot red'; lbl.textContent = 'DISCONNECTED'; }
}

function setBtn(mode) {
  const btn  = document.getElementById('callBtn');
  const icon = document.getElementById('btnIcon');
  const lbl  = document.getElementById('btnLbl');
  const wrap = document.getElementById('btnWrap');
  btn.className = ''; btn.disabled = false;
  wrap.classList.remove('ringing');
  if(mode==='call')   { icon.textContent='📞'; lbl.textContent='CALL'; }
  if(mode==='answer') { btn.classList.add('mode-answer'); wrap.classList.add('ringing'); icon.textContent='📲'; lbl.textContent='ANSWER'; }
  if(mode==='off')    { btn.disabled=true; icon.textContent='📞'; lbl.textContent='CALL'; }
}

function updatePeersCount() {
  const others = S.peers.filter(id => id !== S.myId);
  document.getElementById('peersOnlineCount').textContent = others.length;
}

function updateReadyState() {
  if(S.callState !== 'idle') return;
  updatePeersCount();
  const role = getRole();
  const others = S.peers.filter(id => id !== S.myId);
  if(role==='receiver') {
    setBtn('off');
    setStatus('AUTO-ANSWERING — WAITING FOR CALL', 'ready');
  } else if(others.length === 0) {
    setBtn('off');
    setStatus('WAITING FOR A PEER…', 'idle');
  } else {
    setBtn('call');
    setStatus('TAP TO CALL', 'ready');
  }
}

const getRole = () => document.querySelector('input[name=role]:checked').value;
const canCall = () => { const r=getRole(); return r==='both'||r==='caller'; };
const canRecv = () => { const r=getRole(); return r==='both'||r==='receiver'; };

// ── Role persistence (?mode=receiver and localStorage) ──
const ROLE_KEY = 'yelli.role';
const VALID_ROLES = ['both', 'caller', 'receiver'];
function loadStoredRole() {
  try { const r = localStorage.getItem(ROLE_KEY); return VALID_ROLES.includes(r) ? r : null; }
  catch { return null; }
}
function storeRole(role) {
  try { localStorage.setItem(ROLE_KEY, role); } catch {}
}
(function applyInitialRole() {
  const urlMode = new URLSearchParams(window.location.search).get('mode');
  let role = VALID_ROLES.includes(urlMode) ? urlMode : loadStoredRole();
  if (!role) return;
  if (VALID_ROLES.includes(urlMode)) storeRole(urlMode);
  const el = document.querySelector(`input[name=role][value="${role}"]`);
  if (el) el.checked = true;
})();

document.querySelectorAll('input[name=role]').forEach(r => r.addEventListener('change', () => {
  storeRole(getRole());
  log('Role: ' + getRole().toUpperCase(), 'info');
  if(S.callState==='idle') updateReadyState();
}));

// ── PEER PICKER ──
function renderPicker() {
  const list = document.getElementById('pickerList');
  list.innerHTML = '';
  const others = S.peers.filter(id => id !== S.myId);
  if(!others.length) {
    list.innerHTML = '<div class="picker-empty">No peers online right now.<br>Open {{APP_NAME}} on another device.</div>';
  } else {
    others.forEach(id => {
      const label = S.names[id] || id;
      const el = document.createElement('div');
      el.className = 'picker-item';
      const pid = document.createElement('div'); pid.className = 'pid'; pid.textContent = label;
      const tag = document.createElement('div'); tag.className = 'pcall'; tag.textContent = 'CALL';
      el.append(pid, tag);
      el.onclick = () => { closePicker(); startCall(id); };
      list.appendChild(el);
    });
  }
}

function openPicker() {
  if(!canCall()) { log('Role is Receiver Only', 'warn'); return; }
  renderPicker();
  document.getElementById('pickerModal').classList.add('show');
}

function closePicker() {
  document.getElementById('pickerModal').classList.remove('show');
}

// Click outside picker to close
document.getElementById('pickerModal').addEventListener('click', (e) => {
  if(e.target.id === 'pickerModal') closePicker();
});

// ── WEBSOCKET ──
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}`);
  S.ws = ws;
  ws.onopen = () => {
    setWS(true);
    log('Connected to signaling server', 'ok');
    ws.send(JSON.stringify({ type: 'register', id: S.myId, displayName: S.displayName }));
  };
  ws.onclose = () => {
    setWS(false);
    log('Server disconnected — retrying in 3s…', 'err');
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => log('WebSocket error', 'err');
  ws.onmessage = ({ data }) => {
    let msg;
    try { msg = JSON.parse(data); } catch { return; }
    handleSignal(msg);
  };
}

function wsSend(obj) {
  if(S.ws && S.ws.readyState === WebSocket.OPEN) {
    S.ws.send(JSON.stringify(obj));
  }
}

function setCallOverlay(peerId, status) {
  const label = (peerId && S.names[peerId]) || peerId || '—';
  document.getElementById('callOverlayPeer').textContent = label;
  document.getElementById('callOverlayStatus').textContent = status;
  document.getElementById('callPeerWho').textContent = label;
  document.getElementById('callPeerWhat').textContent = status;
}

function handleSignal(msg) {
  switch(msg.type) {
    case 'peers':
      S.peers = msg.peers.map(p => p.id);
      S.names = {};
      msg.peers.forEach(p => { S.names[p.id] = p.displayName; });
      log(`Peers online: ${msg.peers.length}`, 'info');
      updateReadyState();
      renderPicker();
      break;

    case 'peer-joined':
      if(!S.peers.includes(msg.id)) S.peers.push(msg.id);
      S.names[msg.id] = msg.displayName;
      log(`Joined: ${msg.displayName}`, 'info');
      updateReadyState();
      renderPicker();
      break;

    case 'peer-left':
      S.peers = S.peers.filter(id => id !== msg.id);
      delete S.names[msg.id];
      renderPicker();
      if(S.peerId === msg.id && S.callState !== 'idle') {
        onCallEnded('Peer disconnected');
      }
      log(`Peer left: ${msg.id}`, 'warn');
      updateReadyState();
      break;

    case 'peer-renamed':
      S.names[msg.id] = msg.displayName;
      renderPicker();
      if (S.peerId === msg.id) {
        setCallOverlay(msg.id, document.getElementById('callOverlayStatus')?.textContent);
      }
      break;

    case 'call-request':
      if(!canRecv()) { wsSend({ type: 'call-reject', to: msg.from, reason: 'receiver-only' }); return; }
      if(S.callState !== 'idle') { wsSend({ type: 'call-reject', to: msg.from, reason: 'busy' }); return; }
      setCallState('incoming');
      S.peerId = msg.from;
      log(`Incoming call from ${S.names[msg.from] || msg.from}`, 'warn');
      if (getRole() === 'receiver') {
        // Auto-answer: skip the accept/reject modal entirely
        setStatus('AUTO-ANSWERING…', 'calling');
        acceptCall();
      } else {
        document.getElementById('modalFrom').textContent = `from  ${S.names[msg.from] || msg.from}`;
        document.getElementById('modal').classList.add('show');
        setBtn('answer');
        setStatus('INCOMING CALL', 'calling');
      }
      break;

    case 'call-accept':
      if(S.callState === 'outgoing' && msg.from === S.peerId) {
        setCallState('connecting');
        setStatus('CONNECTING…', 'calling');
        setCallOverlay(S.peerId, 'CONNECTING…');
        log('Peer accepted — sending offer', 'ok');
        sendOfferAfterAccept();
      }
      break;

    case 'call-reject':
      if(S.callState === 'outgoing') {
        const reason = msg.reason === 'busy' ? 'Busy' : 'Declined';
        onCallEnded(reason);
      }
      break;

    case 'offer':  handleRemoteOffer(msg);  break;
    case 'answer': handleRemoteAnswer(msg); break;

    case 'ice-candidate':
      if(S.pc) S.pc.addIceCandidate(new RTCIceCandidate(msg.candidate)).catch(e => log('ICE err: '+e.message,'err'));
      break;

    case 'call-end':
      if(S.callState !== 'idle') {
        document.getElementById('modal').classList.remove('show');
        onCallEnded('Call ended by peer');
      }
      break;

    case 'error': log('Server error: ' + msg.message, 'err'); break;
  }
}

// ── MEDIA ──
async function getMedia() {
  if(S.localStream) return S.localStream;
  try {
    S.localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    log('Camera + mic ready', 'ok');
  } catch {
    try {
      S.localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
      log('Mic ready (no camera)', 'warn');
    } catch(e) {
      log('Media denied: ' + e.message, 'err');
      return null;
    }
  }
  return S.localStream;
}

// ── WebRTC ──
function createPC() {
  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
    ]
  });
  pc.onicecandidate = ({ candidate }) => {
    if(candidate) wsSend({ type: 'ice-candidate', to: S.peerId, candidate });
  };
  pc.oniceconnectionstatechange = () => {
    log('ICE: ' + pc.iceConnectionState);
    if(pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
      onConnected();
    } else if(['disconnected','failed','closed'].includes(pc.iceConnectionState)) {
      if(S.callState === 'in-call') onCallEnded('Connection lost');
    }
  };
  pc.ontrack = ({ streams }) => {
    log('Remote track received', 'ok');
    const rv = document.getElementById('remoteVideo');
    if(streams[0]) rv.srcObject = streams[0];
    document.getElementById('callPlaceholder').classList.add('hidden');
  };
  return pc;
}

// ── CALL FLOW ──
function handleBtn() {
  if(S.callState === 'idle')          openPicker();
  else if(S.callState === 'outgoing') cancelCall();
  else if(S.callState === 'incoming') acceptCall();
  else if(S.callState === 'connecting' || S.callState === 'in-call') hangUp();
}

async function startCall(peerId) {
  if(!canCall()) { log('Role is Receiver Only', 'warn'); return; }
  S.peerId = peerId;

  const stream = await getMedia();
  if(!stream) { S.peerId = null; return; }

  setCallState('outgoing');
  setStatus('CALLING ' + (S.names[peerId] || peerId) + '…', 'calling');
  setCallOverlay(peerId, 'RINGING…');

  setView('call');
  document.getElementById('callPlaceholder').classList.remove('hidden');
  document.getElementById('localVideo').srcObject = stream;
  document.getElementById('pip').classList.add('show');

  wsSend({ type: 'call-request', to: peerId });
  log('Ringing ' + (S.names[peerId] || peerId) + '…', 'info');
}

async function sendOfferAfterAccept() {
  if(!S.localStream) { log('No local media — aborting', 'err'); cancelCall(); return; }
  S.pc = createPC();
  S.localStream.getTracks().forEach(t => S.pc.addTrack(t, S.localStream));
  const offer = await S.pc.createOffer();
  await S.pc.setLocalDescription(offer);
  wsSend({ type: 'offer', to: S.peerId, sdp: S.pc.localDescription });
  log('Offer sent to ' + S.peerId, 'info');
}

function cancelCall() {
  wsSend({ type: 'call-end', to: S.peerId });
  onCallEnded('Cancelled');
}

async function handleRemoteOffer(msg) {
  if(!S.pc) { log('Got offer but no PC — rejecting', 'warn'); return; }
  await S.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
  const answer = await S.pc.createAnswer();
  await S.pc.setLocalDescription(answer);
  wsSend({ type: 'answer', to: S.peerId, sdp: S.pc.localDescription });
  log('Answer sent to ' + S.peerId, 'info');
}

async function handleRemoteAnswer(msg) {
  if(!S.pc) return;
  await S.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
  log('Remote answer applied', 'ok');
}

async function acceptCall() {
  document.getElementById('modal').classList.remove('show');
  setCallState('connecting');

  const stream = await getMedia();
  if(!stream) { rejectCall(); return; }

  S.pc = createPC();
  stream.getTracks().forEach(t => S.pc.addTrack(t, stream));

  setView('call');
  setCallOverlay(S.peerId, 'CONNECTING…');
  document.getElementById('callPlaceholder').classList.remove('hidden');
  document.getElementById('localVideo').srcObject = stream;
  document.getElementById('pip').classList.add('show');

  wsSend({ type: 'call-accept', to: S.peerId });
  setStatus('CONNECTING…', 'calling');
  log('Call accepted — waiting for offer…', 'ok');
}

function rejectCall() {
  document.getElementById('modal').classList.remove('show');
  wsSend({ type: 'call-reject', to: S.peerId, reason: 'rejected' });
  setCallState('idle');
  S.peerId = null;
  setStatus('CALL REJECTED');
  log('Incoming call rejected');
  updateReadyState();
}

function onConnected() {
  if(S.callState === 'in-call') return;
  setCallState('in-call');
  setStatus('IN CALL ● ' + (S.names[S.peerId] || S.peerId), 'in-call');
  setCallOverlay(S.peerId, 'CONNECTED');
  S.timerStart = Date.now();
  S.timerInt = setInterval(tickTimer, 500);
  log('Call connected!', 'ok');
}

function tickTimer() {
  const s = Math.floor((Date.now()-S.timerStart)/1000);
  const m = String(Math.floor(s/60)).padStart(2,'0');
  const sec = String(s%60).padStart(2,'0');
  document.getElementById('timer').textContent = m + ':' + sec;
}

function hangUp() {
  wsSend({ type: 'call-end', to: S.peerId });
  onCallEnded('Call ended');
}

function onCallEnded(reason) {
  cleanupCall();
  setStatus(reason.toUpperCase());
  log(reason, 'warn');
  setTimeout(() => updateReadyState(), 100);
}

function cleanupCall() {
  clearInterval(S.timerInt);
  document.getElementById('timer').textContent = '00:00';
  document.getElementById('callPlaceholder').classList.remove('hidden');
  document.getElementById('pip').classList.remove('show');
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('localVideo').srcObject = null;
  if(S.pc) { S.pc.close(); S.pc = null; }
  if(S.localStream) { S.localStream.getTracks().forEach(t=>t.stop()); S.localStream=null; }
  setCallState('idle');
  S.peerId = null;
  S.muted = false; S.camOff = false;
  document.getElementById('muteBtn').textContent='🎤';
  document.getElementById('muteBtn').classList.remove('off');
  document.getElementById('camBtn').textContent='📷';
  document.getElementById('camBtn').classList.remove('off');
  setView('idle');
}

// ── CONTROLS ──
function toggleMute() {
  if(!S.localStream) return;
  S.muted = !S.muted;
  S.localStream.getAudioTracks().forEach(t => t.enabled = !S.muted);
  const b = document.getElementById('muteBtn');
  b.textContent = S.muted ? '🔇' : '🎤';
  b.classList.toggle('off', S.muted);
}

function toggleCam() {
  if(!S.localStream) return;
  S.camOff = !S.camOff;
  S.localStream.getVideoTracks().forEach(t => t.enabled = !S.camOff);
  const b = document.getElementById('camBtn');
  b.textContent = S.camOff ? '🚫' : '📷';
  b.classList.toggle('off', S.camOff);
}

// ── INIT ──
function genId() {
  return [...crypto.getRandomValues(new Uint8Array(3))]
    .map(b => b.toString(16).padStart(2,'0')).join('').toUpperCase();
}

(async function init() {
  await ensureDisplayName();
  S.myId = genId();
  document.getElementById('myIdDisplay').textContent = S.myId;
  setStatus('CONNECTING…');
  setBtn('off');
  connectWS();
  log('{{APP_NAME}} starting — ID: ' + S.myId, 'ok');
})();

document.getElementById('editNameBtn')?.addEventListener('click', async () => {
  const updated = await openNameModal({ mode: 'edit' });
  if (!updated || updated === S.displayName) return;
  S.displayName = updated;
  storeName(updated);
  refreshOwnNameLabel();
  if (S.ws && S.ws.readyState === WebSocket.OPEN) {
    S.ws.send(JSON.stringify({ type: 'rename', displayName: updated }));
  }
});
</script>
