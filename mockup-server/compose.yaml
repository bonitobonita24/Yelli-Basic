services:
  mockup:
    build: .
    container_name: yelli-mockup-server
    ports:
      # Host 6174 -> container 5173 (Vite). Uncommon port; unlikely to clash.
      - "6174:5173"
    volumes:
      # Live-mount the canonical mockup file from repo root so edits hot-reload
      - ../MOCKUP.jsx:/MOCKUP.jsx:ro
      # Live-mount the source dir + configs so iterating on shell or styles also reloads
      - ./src:/app/src
      - ./vite.config.js:/app/vite.config.js:ro
      - ./tailwind.config.js:/app/tailwind.config.js:ro
      - ./postcss.config.js:/app/postcss.config.js:ro
      - ./index.html:/app/index.html:ro
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    restart: unless-stopped
