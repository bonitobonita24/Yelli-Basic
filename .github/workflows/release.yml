# .github/workflows/release.yml
# Builds and pushes a versioned production image on every vX.Y.Z tag push.
# Tags pushed per run:
#   :vX.Y.Z  — immutable version tag (e.g. v1.0.0)
#   :prod    — floating "current production" tag (Komodo prod stack uses this)
# Requires the same secrets as docker-publish.yml:
#   DOCKERHUB_USERNAME — your Docker Hub username
#   DOCKERHUB_TOKEN    — Docker Hub access token
#   DOCKER_IMAGE_NAME  — GitHub Actions variable (e.g. yelli)

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}

jobs:
  release:
    name: Build & push release image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=prod

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/yelli/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
