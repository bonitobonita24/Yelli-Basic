services:
  yelli:
    container_name: yelli-maes
    build:
      context: ./AlphaTest
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal
    environment:
      NODE_ENV: production
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: yelli-maes-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    networks:
      - internal
    depends_on:
      - yelli

networks:
  internal:
    driver: bridge
