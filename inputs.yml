# Yelli Spec — V31 framework lock complete 2026-05-31
# Generated by Prompt 1.5.4 brownfield Adoption-mode Bootstrap 2026-06-01
# This file is AGENT-OWNED. Never edit manually. (Rule 2)
# To change anything: edit docs/PRODUCT.md → Feature Update

version: 3

app:
  name: "Yelli"
  slug: yelli
  tagline: "Video calling for your network — your LAN or our cloud, your call."
  owner: "Powerbyte IT Solutions"
  edition_model: dual                  # OSS LAN + SaaS Cloud, single codebase, feature parity

# ---- Brownfield migration flag ----
migration:
  brownfield: true
  current_stack:
    runtime: nodejs-vanilla
    signaling: ws
    database: none
    auth: none
    frontend: vanilla-html-css-js
    container: dockerfile-single-stage
  target_stack:
    runtime: nodejs
    framework: nextjs
    api: trpc
    orm: prisma
    auth: authjs-v5
    database: postgresql
    cache: valkey
    queue: bullmq
    storage:
      dev: minio
      prod: s3
    frontend: react
    ui_library: shadcn-ui
    styling: tailwind+clay-tokens
    pwa: workbox+web-push
    signaling: ws-via-trpc-subscription
  rewrite_strategy: "Phase 4 Part 1 rewrites signaling layer; existing public/index.html is visual reference"
  retained_assets:
    - "public/index.html (Clay tokens reference for shadcn var mapping)"
    - "scripts/gen-cert.sh (LAN HTTPS cert generation)"
    - "scripts/tunnel.sh (dev cloudflared tunnel)"
    - "deploy/windows/* + Install-Yelli.* (LAN distribution)"
    - "compose.yaml (cloudflared sidecar pattern carries forward to deploy/compose/prod/)"

tenancy:
  mode: multi                          # Cloud; LAN runs single-implicit (slug=default)
  routing: subdomain                   # *.yelli.app
  lan_mode:
    enabled: true
    default_mode: anonymous            # anonymous OR account
    admin_auth: argon2id-passphrase

apps:
  - name: yelli
    framework: nextjs
    type: web
    port: null                          # Phase 3 assigns
    pwa: true

tech_stack:
  frontend: nextjs
  api: trpc
  orm: prisma
  auth: authjs
  database: postgresql
  cache: valkey
  queue: bullmq
  storage_dev: minio
  storage_prod: s3
  ui_library: shadcn-ui
  icon_library: lucide-react
  webrtc:
    signaling: ws-via-trpc-subscription
    stun: stun.l.google.com
    turn: coturn-self-hosted            # Cloud only
  pwa:
    service_worker: workbox
    push: web-push

# ---- Core entities (all from PRODUCT.md Data Entities section) ----
entities:
  - Tenant
  - User
  - Device
  - Invitation
  - AuditLog
  - CallSession
  - WebPushSubscription
  # Auth.js managed: Session, VerificationToken, Account

# ---- Jobs + queues ----
jobs:
  enabled: true
  provider: bullmq
  queues:
    - name: tenant-export
      rate_limit_per_tenant_24h: 1
    - name: device-archive-cron
      schedule: "0 3 * * *"             # daily 03:00 UTC
      offline_threshold_days: 90
    - name: soft-delete-hard-delete-cron
      schedule: "0 4 * * *"             # daily 04:00 UTC
      threshold_days: 7
    - name: backup-cron
      schedule: "0 2 * * *"             # daily 02:00 UTC
      target: "s3://yelli-backups-prod/postgres/"
    - name: email
    - name: logo-image-processing

# ---- File storage ----
storage:
  enabled: true
  provider: minio                       # dev; prod uses S3
  buckets:
    uploads: yelli-prod-uploads         # versioned, no TTL
    backups: yelli-backups-prod         # 30d expiry, Glacier IR after 7d
    exports: yelli-tenant-exports       # 24h expiry

# ---- Security ----
security:
  layers:
    L1_trpc_tenant_scoping: active
    L2_postgres_rls: active
    L3_rbac_middleware: active
    L4_pgbouncer_pool_limits: active
    L5_immutable_auditlog: active
    L6_prisma_guardrails: active        # $allOperations extension
  audit_retention_years: 7              # PH BIR
  call_session_retention_years: 1
  session_kill_sla_seconds: 30
  rate_limits:
    public: 30                          # req/min/IP
    auth: 10                            # req/min/IP
    api: 120                            # req/min/user
    upload: 20                          # req/min/user
  turnstile:
    enabled: true                       # Cloud only
    widget_mode: managed
  csrf:
    approach: same-site-lax-cookies     # tRPC + Auth.js v5 inherently CSRF-resistant
  webhook_security: signature-required

# ---- Deployment ----
deploy:
  cloud:
    manager: komodo
    proxy: traefik
    staging:
      auto_update: true                 # polls :staging-latest
    prod:
      auto_update: false                # manual deploy from Komodo UI
      tag_scheme: semver                # :vX.Y.Z immutable + floating :prod
      tag_retention: 10                 # prior semver tags retained on Docker Hub
  lan:
    distribution: docker-image          # docker compose up
    license: MIT
    auto_update: false                  # no auto-update for LAN; customer pulls
    repo_visibility: public
  k8s:
    enabled: false

docker:
  publish: true
  registry: docker.io
  hub_repo: powerbyteit/yelli
  image_name: yelli
  platforms:
    - linux/amd64
    - linux/arm64
  build_on_push_to: main
  dev_build: true                       # dev rebuilds from source

# ---- Domains ----
domains:
  prod: yelli.app
  prod_wildcard: "*.yelli.app"
  staging: yelli-staging.app
  staging_wildcard: "*.yelli-staging.app"
  status: status.yelli.app
  super_admin_path: "/_pwbt/"

# ---- Ports (Phase 3 generates random base in 40000-49999) ----
ports:
  dev:
    base: null                          # Phase 3 assigns
    db: null
    pgbouncer: null
    redis: null
    minio: null
    minio_console: null
    mailhog: null
    mailhog_ui: null
    pgadmin: null
    app: null
    worker: null
    prisma_studio: null

# ---- Tenant slug rules ----
tenant_slugs:
  regex: '^[a-z][a-z0-9-]*[a-z0-9]$'
  min_length: 3
  max_length: 30
  immutable: true
  reserved_path: src/config/reserved-slugs.ts
  reserved:
    - www
    - api
    - app
    - admin
    - staging
    - dev
    - _pwbt
    - pwbt
    - status
    - blog
    - docs
    - mail
    - smtp
    - mx
    - support
    - help
    - auth
    - cdn

# ---- Operations (Step 9) ----
operations:
  status_page:
    type: cloudflare-pages-static
    domain: status.yelli.app
    repo_dir: status-page/
  observability:
    errors: glitchtip-self-hosted
    logs: docker-json-file + komodo-viewer
    format: structured-json
    central_aggregator: deferred
    apm: deferred
  uptime:
    provider: uptimerobot
    plan: free
    interval_minutes: 5
    probes:
      - "https://yelli.app/"
      - "https://yelli.app/_pwbt/health"
    alerts:
      - oncall@powerbyteitsolutions.com
      - telegram-channel
  perf:
    harness: k6
    script: tests/perf/signaling.k6.js
    concurrent_peers: 200
    requests_per_second_per_peer: 1
    duration_minutes: 5
    baseline_dir: perf-baselines/
    regression_thresholds:
      p95_signaling_ms_max: 150
      p95_call_setup_ms_max: 3000

# ---- Git ----
git:
  default_branch: main
  branch_pattern: feat/{slug}
  scaffold_branch_pattern: scaffold/part-{N}
  fix_branch_pattern: fix/{slug}
  chore_branch_pattern: chore/{slug}
  commit_style: conventional
  squash_merge: true
  use_worktrees: false                  # not required for brownfield migration

# ---- Models (Architect-Execute V32) ----
models:
  planning: claude-code                 # Opus 4.7
  execution: claude-sonnet-4-6           # Sonnet 4.6 via Claude Code (V32 R1)
  governance: gemini-2.5-flash-lite     # non-critical doc writes

# ---- Optional toggles ----
context7:
  enabled: true                         # Rule 30 — Context7 MCP for live library docs

accessibility:
  level: wcag_aa                        # PWA + Cloud needs AA

vibe_test:
  enabled: true                         # Phase 2.7 spec stress-test

# ---- Design Identity (from PRODUCT.md Section K + DESIGN.md) ----
design:
  style: clay
  primary_canvas: "#fffaf0"
  primary_accent: "#0a0a0a"
  palette:
    - pink
    - teal
    - lavender
    - peach
    - ochre
    - mint
  radii:
    button: 12px
    card: 24px
  typography:
    family: Inter
    weight: 500
    letter_spacing: negative
  dark_mode: false                      # not required in MVP
  mobile_first: true                    # Step 10 lock
  baseline_breakpoint: 375              # px portrait
  breakpoints:
    md: 768
    lg: 1024
  touch_target_min_px: 44
