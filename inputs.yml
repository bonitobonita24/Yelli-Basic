schema_version: 3
app:
  name: "Yelli"
  slug: "yelli"
  purpose: "Dual-mode (LAN + Cloud) peer-to-peer calling for marine ops and small teams"

domains:
  prod: "yelli.app"
  staging: "yelli-staging.app"

tenancy:
  mode: "multi"
  notes: "Hybrid LAN + Cloud from one codebase. Cloud edition is multi-tenant via subdomain
    routing (<slug>.yelli.app; tenantId on every entity; V25 cross-check). LAN edition runs
    single-tenant (single implicit tenant row, slug=default) from the same codebase. Feature
    parity between editions is non-negotiable."

apps:
  - name: "yelli"
    framework: "next"
    type: "web"
  - name: "signaling"
    framework: "node"
    type: "service"   # standalone WebSocket signaling server (W2b); Traefik PathPrefix(/ws)

# Domain models (8). Auth.js v5 owns Session, VerificationToken, Account separately (schema-managed).
entities:
  - Tenant
  - User
  - Device
  - Invitation
  - AuditLog
  - CallSession
  - WebPushSubscription
  - ExportJob          # referenced by AuditLog.targetType + tenant.export.* flow; field shape lands in Part 3 (S2)

modules:
  - calling
  - directory
  - device-identity
  - accounts-auth
  - tenancy-members
  - branding
  - admin-console
  - pwa

roles:
  - device-user            # LAN anonymous mode only
  - member                 # Cloud + LAN account mode
  - tenant-admin           # inherits member
  - powerbyte-super-admin  # Cloud only; /_pwbt/

tech_stack:
  frontend: "Next.js 16 App Router"
  api: "tRPC v11"
  orm: "Prisma"
  auth: "Auth.js v5"
  database: "PostgreSQL 16"
  cache: "Valkey 7"
  storage_dev: "MinIO"
  storage_prod: "S3"
  ui: "shadcn/ui + Tailwind CSS"

ports:
  dev:
    base: 46838
    db: 46838
    pgbouncer: 46839
    valkey: 46840
    minio: 46841
    minio_console: 46842
    mailhog: 46843
    mailhog_ui: 46844
    pgadmin: 46845
    app: 46848
    worker: 46849
    signaling: 46850
    prisma_studio: 46858

jobs:
  enabled: true
  provider: "bullmq"
  # 6 queues — grounded in DECISIONS_LOG.md "LOCKED: Jobs + Queues" (Step 5) + "LOCKED: Database Backup" (Step 7)
  queues:
    - "device-archive"     # cron daily 03:00 UTC; 90-day offline auto-archive + unarchive-on-reconnect
    - "tenant-export"      # JSON bundle -> S3/MinIO -> signed 24h URL email; rate-limited 1/tenant/24h
    - "soft-delete-cron"   # 7-day soft-delete -> hard-delete sweep
    - "backup"             # cron daily 02:00 UTC; pg_dump custom -> S3 30d / Glacier IR 7d
    - "email"              # invitation / verify / reset transactional email
    - "logo-image"         # tenant branding logo resize + format

storage:
  enabled: true
  provider_dev: "minio"
  provider_prod: "s3"
  buckets:
    dev: "yelli-dev"
    staging: "yelli-staging"
    prod: "yelli-prod"

deploy:
  k8s:
    enabled: false

docker:
  publish: true
  registry: "docker.io"
  hub_repo: "powerbyteit/yelli"
  image_name: "yelli"
  platforms:
    - "linux/amd64"
    - "linux/arm64"
  build_on_push_to: "main"
  dev_build: true

git:
  default_branch: "main"
  branch_pattern: "feat/{slug}"
  commit_style: "conventional"
  squash_merge: true
  use_worktrees: true

models:
  planning: "claude-code"
  execution: "claude-sonnet-4-6"
  governance: "gemini-2.5-flash-lite"

payment:
  gateway: "none"

turnstile:
  enabled: false

accessibility:
  level: "none"

context7:
  enabled: true

vibe_test:
  enabled: true

security:
  cors_origins:
    dev:
      - "http://localhost:46848"
      - "http://127.0.0.1:46848"
    staging:
      - "https://yelli-staging.app"
      - "https://*.yelli-staging.app"
    prod:
      - "https://yelli.app"
      - "https://*.yelli.app"
  # Audit action prefixes — grounded in PRODUCT.md AuditLog.action enum (Data Entities)
  audit_events:
    - "member.*"
    - "device.*"
    - "tenant.*"
    - "auth.*"
    - "superadmin.*"
    - "lan.*"
    - "pwa.*"
  rate_limiting:
    auth_per_minute_per_ip: 10
    api_per_minute_per_user: 100
    public_per_minute_per_ip: 300
    upload_per_minute_per_user: 20
