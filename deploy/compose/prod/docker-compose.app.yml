# ⚠ NO build: key — prod pulls from Docker Hub only, never builds from source
# Image tag: APP_IMAGE_TAG defaults to :prod (floating per semver+floating :prod scheme)
# Immutable tags: :vX.Y.Z retained on Docker Hub (tag_retention: 10)
# App traffic routed via Traefik OR cloudflared sidecar — no host port exposed (V27)
# See docker-compose.cloudflared.yml for sidecar routing when Traefik docker-provider is broken

networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true

services:
  app:
    image: ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${APP_IMAGE_TAG:-prod}
    container_name: ${COMPOSE_PROJECT_NAME}_app
    hostname: ${COMPOSE_PROJECT_NAME}_app
    env_file: ../../../.env.prod
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL_INTERNAL}
      REDIS_URL: ${REDIS_URL_INTERNAL}
    networks: [app_network, proxy]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_app.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_app.tls.certresolver=letsEncrypt"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}_app.loadbalancer.server.port=3000"
