# Signaling WS server — production. Pulls a pre-built image from Docker Hub (NO build).
# Routed by Traefik at PathPrefix(`/ws`) on ${APP_DOMAIN} with HIGHER priority than the
# app's Host() router. Traefik proxies the WebSocket upgrade transparently.
# If the Traefik docker-provider is broken on the host (srv709899), the cloudflared
# sidecar reaches ${COMPOSE_PROJECT_NAME}_signaling:3001 via Docker DNS instead.
networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true

services:
  signaling:
    # ⚠ NO build: key — prod pulls from Docker Hub only.
    image: ${DOCKERHUB_USERNAME}/yelli-signaling:${SIGNALING_IMAGE_TAG:-prod}
    container_name: ${COMPOSE_PROJECT_NAME}_signaling
    hostname: ${COMPOSE_PROJECT_NAME}_signaling
    env_file: ../../../.env.prod
    environment:
      NODE_ENV: production
      SIGNALING_PORT: "3001"
      REDIS_URL: ${REDIS_URL_INTERNAL}
    networks: [app_network, proxy]
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_signaling.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_signaling.priority=100"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_signaling.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_signaling.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_signaling.tls.certresolver=letsencrypt"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}_signaling.loadbalancer.server.port=3001"
