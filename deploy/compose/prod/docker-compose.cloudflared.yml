# Migration-retained sidecar pattern from project-root compose.yaml (yelli-maes.powerbyte.app live deploy).
#
# USE THIS FILE when Traefik docker-provider discovery is broken on the host (e.g. srv709899).
# The cloudflared container runs inside the same Docker bridge network and reaches
# yelli_prod_app:3000 via Docker DNS — no host port exposure required.
#
# SETUP:
#   1. Set CF_TUNNEL_TOKEN in .env.prod (obtain from Cloudflare dashboard → Zero Trust → Tunnels)
#   2. Start alongside docker-compose.app.yml:
#        docker compose -f docker-compose.app.yml -f docker-compose.cloudflared.yml up -d
#
# TRAEFIK vs CLOUDFLARED:
#   Either Traefik labels (docker-compose.app.yml) OR this sidecar handles inbound routing — pick one per host.
#   Both can coexist in the compose without conflict; only the active routing path serves traffic.
#   On srv709899 or any host where Traefik docker-provider is silent, use this sidecar instead.

networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${COMPOSE_PROJECT_NAME}_cloudflared
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.5
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
      TZ: Asia/Manila
    networks: [app_network]
    depends_on:
      - app
