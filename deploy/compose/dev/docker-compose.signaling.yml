networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true

services:
  signaling:
    build:
      context: ../../..
      dockerfile: apps/signaling/Dockerfile
    image: yelli-signaling:dev-latest
    container_name: ${COMPOSE_PROJECT_NAME}_signaling
    hostname: ${COMPOSE_PROJECT_NAME}_signaling
    env_file: ../../../.env.dev
    environment:
      NODE_ENV: development
      # Container always listens on 3001; SIGNALING_PORT in .env.dev is the HOST port.
      SIGNALING_PORT: "3001"
      REDIS_URL: ${REDIS_URL_INTERNAL}
    ports:
      - "${SIGNALING_PORT}:3001"
    networks: [app_network]
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
