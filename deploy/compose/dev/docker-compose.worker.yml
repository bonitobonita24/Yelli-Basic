networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true

services:
  worker:
    build:
      context: ../../..
      dockerfile: packages/jobs/Dockerfile.workers
    image: yelli-worker:dev-latest
    container_name: ${COMPOSE_PROJECT_NAME}_worker
    hostname: ${COMPOSE_PROJECT_NAME}_worker
    env_file: ../../../.env.dev
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL_INTERNAL}
      REDIS_URL: ${REDIS_URL_INTERNAL}
      TZ: Asia/Manila
    networks: [app_network]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
