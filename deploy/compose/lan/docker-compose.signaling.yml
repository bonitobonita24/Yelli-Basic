networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true

services:
  signaling:
    # LAN edition uses pre-built images only — no build: key.
    image: yelli-signaling:lan
    container_name: ${COMPOSE_PROJECT_NAME}_signaling
    hostname: ${COMPOSE_PROJECT_NAME}_signaling
    env_file: ../../../.env.lan
    environment:
      NODE_ENV: production
      # Container always listens on 3001; Caddy routes /ws* to this container.
      SIGNALING_PORT: "3001"
      REDIS_URL: ${REDIS_URL_INTERNAL}
      TZ: Asia/Manila
    # No host ports — Caddy proxies /ws* → this container on the internal network.
    networks: [app_network]
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
