# ⚠ NO build: key — staging pulls the worker image from Docker Hub only, never builds
# Background BullMQ worker host (W5-runtime): no host port, no Traefik labels.

networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true

services:
  worker:
    image: ${DOCKERHUB_USERNAME}/${WORKER_IMAGE_NAME:-yelli-worker}:${WORKER_IMAGE_TAG:-staging-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_worker
    hostname: ${COMPOSE_PROJECT_NAME}_worker
    env_file: ../../../.env.staging
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_INTERNAL}
      REDIS_URL: ${REDIS_URL_INTERNAL}
    networks: [app_network]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
